let compteChoisi = null;
let echecs = 0;

function ecranConnexion(){
  const actifs = D.comptes.filter(c => c.actif !== false);
  if (!compteChoisi || !actifs.some(c => c.id === compteChoisi)){
    compteChoisi = actifs.length === 1 ? actifs[0].id : null;
  }
  afficherAcces(
    LOGO
    + "<h2>" + ech(D.etablissement) + "</h2>"
    + '<p class="sous">Choisissez votre compte et saisissez votre mot de passe.</p>'
    + '<div class="comptes">'
    + actifs.map(c =>
        '<button class="compte-b" data-cid="'+c.id+'" aria-pressed="'+(c.id===compteChoisi)+'">'
        + '<span class="av">'+ech(c.nom.trim().charAt(0).toUpperCase() || "?")+'</span>'
        + '<span class="cn"><b>'+ech(c.nom)+'</b><span>'
        + (c.role==="admin" ? "Administrateur" : "Utilisateur")
        + ' · dernière connexion ' + horodatage(c.derniereConnexion) + '</span></span></button>').join("")
    + '</div>'
    + '<label><span class="lib">Mot de passe</span>'
    + '<input id="cxMdp" type="password" autocomplete="current-password"></label>'
    + '<button class="btn" id="cxOk" style="margin-top:12px">Se connecter</button>'
    + '<button class="lien" id="cxOubli">Mot de passe oublié ?</button>'
    + (Synchro.active() && !estDetache()
        ? '<button class="lien" id="cxMaj">Mon compte vient d\'être créé : actualiser la liste</button>'
        : ''),
  ()=>{
    accesCorps.querySelectorAll("[data-cid]").forEach(b =>
      b.addEventListener("click", ()=>{ compteChoisi = b.dataset.cid; ecranConnexion(); }));
    const champ = document.getElementById("cxMdp");
    champ.addEventListener("keydown", e => { if (e.key === "Enter") tenterConnexion(); });
    document.getElementById("cxOk").addEventListener("click", tenterConnexion);
    document.getElementById("cxOubli").addEventListener("click", ecranOubli);
    const maj = document.getElementById("cxMaj");
    if (maj) maj.addEventListener("click", async ()=>{
      maj.textContent = "Mise à jour…";
      const avant = D.comptes.length;
      const r = await Synchro.synchroniser(true);
      if (r && r.erreur) signaler("Serveur injoignable : " + r.erreur);
      else if (D.comptes.length > avant) signaler("Liste des comptes mise à jour");
      else signaler("Aucun nouveau compte");
      if (document.getElementById("cxMaj")) ecranConnexion();
    });
    if (compteChoisi) setTimeout(()=>champ.focus(), 60);
  });
}

async function tenterConnexion(){
  const compte = compteDe(compteChoisi);
  const mdp = document.getElementById("cxMdp").value;
  if (!compte){ signaler("Choisissez votre compte"); return; }
  if (!mdp){ signaler("Saisissez votre mot de passe"); return; }

  const bouton = document.getElementById("cxOk");
  bouton.textContent = "Vérification…"; bouton.setAttribute("disabled","");
  const bon = await motDePasseValide(compte, mdp);

  if (!bon){
    echecs++;
    session = null;
    journaliser("Connexion refusée", compte.nom);
    bouton.removeAttribute("disabled"); bouton.textContent = "Se connecter";
    document.getElementById("cxMdp").value = "";
    /* attente croissante : ralentit les essais en série sur un téléphone volé */
    if (echecs >= 3){
      const attente = Math.min(30, (echecs - 2) * 5);
      bouton.setAttribute("disabled","");
      let reste = attente;
      bouton.textContent = "Patientez " + reste + " s";
      const t = setInterval(()=>{
        reste--;
        if (reste <= 0){ clearInterval(t); bouton.removeAttribute("disabled");
                         bouton.textContent = "Se connecter"; }
        else bouton.textContent = "Patientez " + reste + " s";
      }, 1000);
    }
    signaler("Mot de passe incorrect");
    return;
  }

  echecs = 0;
  session = { id:compte.id, nom:compte.nom, role:compte.role };
  compte.derniereConnexion = new Date().toISOString();
  compte.nbConnexions = (compte.nbConnexions || 0) + 1;

  achats = null; cleCoffre = null;
  if (compte.role === "admin" && D.coffre){
    try{
      cleCoffre = await ouvrirCoffre(mdp, false);
      const contenu = await lireCoffre(cleCoffre);
      achats = contenu.prixAchat || {};
    }catch(e){
      /* mot de passe changé sans réenfermer le coffre : cas anormal, on le dit */
      signaler("Prix d'achat inaccessibles : utilisez le code de secours");
    }
  }
  journaliser("Connexion", compte.role === "admin" ? "administrateur" : "utilisateur");
  lancerApplication();
  if (Synchro.cfg && Synchro.cfg.auto && Synchro.active()) Synchro.synchroniser(true);
}

/* Le compte de la session en cours existe-t-il encore, et est-il actif ? */
function monCompteEstValide(){
  if (!session) return true;
  const c = compteDe(session.id);
  return !!c && c.actif !== false;
}

function deconnexion(){
  journaliser("Déconnexion", "");
  session = null; cleCoffre = null; achats = null;
  document.querySelectorAll(".vue").forEach(v => v.classList.remove("actif"));
  fermerFeuille();
  ecranConnexion();
}

/* =====================================================================
   INSTALLATION SUR L'APPAREIL
   Chrome ne propose l'installation que si la page est servie en HTTPS, avec
   un manifeste et un service worker enregistré. Ouvert directement depuis le
   gestionnaire de fichiers (protocole file:), tout fonctionne sauf
   l'installation : le code ci-dessous se contente alors de se taire.
   ===================================================================== */
let invitationInstall = null;

function estInstallee(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || window.navigator.standalone === true;
  }catch(e){ return false; }
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  invitationInstall = e;
  if (vueActive === "boissons") rendreBoissons();
});

window.addEventListener("appinstalled", ()=>{
  invitationInstall = null;
  signaler("Application installée sur l'écran d'accueil");
  if (vueActive === "boissons") rendreBoissons();
});

async function lancerInstallation(){
  if (!invitationInstall){
    signaler("Utilisez le menu du navigateur, « Installer l'application »");
    return;
  }
  const invitation = invitationInstall;
  invitationInstall = null;
  try{
    invitation.prompt();
    const choix = await invitation.userChoice;
    if (choix && choix.outcome === "dismissed") invitationInstall = invitation;
  }catch(e){ signaler("Installation impossible depuis ce navigateur"); }
  if (vueActive === "boissons") rendreBoissons();
}

/* mise en cache de l'application pour un fonctionnement sans réseau */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

    + (D.derniereSauvegarde ? horodatage(D.derniereSauvegarde) : "jamais") + '</b></div>'
    + (durable ? '' : '<button class="btn btn-fant" id="gDurable" style="margin-top:10px">'
        + 'Demander la protection du stockage</button>');
  const bd = document.getElementById("gDurable");
  if (bd) bd.addEventListener("click", async ()=>{
    const r = await demanderDurabilite();
    signaler(r === true ? "Stockage protégé"
      : r === false ? "Refusé : installez l'application sur l'écran d'accueil"
      : "Non pris en charge par ce navigateur");
    remplirEtatBase();
  });
}

function joursDepuisSauvegarde(){
  if (!D.derniereSauvegarde) return 9999;
  return Math.floor((Date.now() - new Date(D.derniereSauvegarde).getTime()) / 86400000);
}

document.getElementById("btnReglages").addEventListener("click", ouvrirReglages);

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
const CATALOGUE_GEBEN = [
"FLAG GM","LB GM","LB PM","BEAUFORT GM","BEAUFORT PM","CASTEL GM","CHILL GM","CHILL PM",
"COCA GM","COCA PM","COCA PET","COCKTAIL GM","COCKTAIL PM","COCKTAIL PET","DOPPEL GM",
"DOPPEL PM","EKU PM","GUINNESS PM","HAGBE","KANKPE","AWOYO BENIN","AWOYO TOGO","VALMONT",
"MALTA ENER","MALTA CAFE","MALTA CANET","MOKA GM","MOKA PM","PAMPL GM","PAMPL PM","PAMPL PET",
"PILS GM","YOUZOU GM","YOUZOU PM","SPRIT PET","TEQUILA BOOSTER","BULDOZER","XXL PM","LEGEND",
"DESPERADO","ENERGY DRINK","HEINEKEN","JUS IRA","VODY","CONTESSE","AQUA BELLE","FIFA","KWABO",
"POSSOCITRON","POSSOTOMEY","CASSERA","GEZEFIE"
];

function normaliser(d){
  const n = {
    etablissement: (d.etablissement || "BAR RESTO GEBEN").slice(0,40),
    theme: {
      fond: (d.theme && d.theme.fond) || THEME_DEFAUT.fond,
      accent: (d.theme && d.theme.accent) || THEME_DEFAUT.accent
    },
    comptes: (Array.isArray(d.comptes) ? d.comptes : []).map(c =>
               Object.assign({ maj: c.maj || c.creeLe || maintenant() }, c)),
    supprimes: Array.isArray(d.supprimes) ? d.supprimes : [],
    /* Origine des temps par défaut : un réglage jamais touché sur ce téléphone
       ne doit pas l'emporter sur celui d'un autre appareil. Sans cela, un
       téléphone qui vient de se rattacher rejetterait tous les réglages reçus,
       ses propres horodatages étant forcément plus récents. */
    meta: {
      reglages: (d.meta && d.meta.reglages) || ORIGINE_DES_TEMPS,
      coffre:   (d.meta && d.meta.coffre)   || ORIGINE_DES_TEMPS,
      verrou:   (d.meta && d.meta.verrou)   || ORIGINE_DES_TEMPS
    },
    coffre: d.coffre || null,
    verrou: d.verrou || null,
    journal: Array.isArray(d.journal) ? d.journal : [],
    dateDepart: d.dateDepart || aujourdhui(),
    boissons: [],
    receptions: (d.receptions || []).map(r => Object.assign({ maj: r.maj || maintenant() }, r)),
    saisies: [],
    inventaires: (d.inventaires || []).map(i => Object.assign({ maj: i.maj || maintenant() }, i)),
    comptage: d.comptage || null,
    derniereSauvegarde: d.derniereSauvegarde || null,
    compteur: d.compteur || 1
  };

  /* Reprise d'une version antérieure aux comptes : les prix d'achat quittent
     les fiches pour rejoindre le coffre dès que l'administrateur est créé. */
  const aReprendre = {};
  let quelqueChoseAReprendre = false;

  (d.boissons || []).forEach(b => {
    const fiche = {
      id: b.id || ("b" + Math.random().toString(36).slice(2,9)),
      nom: b.nom || "",
      marque: b.marque || "", format: b.format || "",
      prixVente: Math.max(0, Math.round(+b.prixVente || 0)),
      stockInitial: Math.max(0, Math.round(+(b.stockInitial != null ? b.stockInitial : b.stock) || 0)),
      seuil: Math.max(0, Math.round(+b.seuil || 0)),
      maj: b.maj || maintenant()
    };
    if (!n.coffre && b.prixAchat){
      aReprendre[fiche.id] = Math.max(0, Math.round(+b.prixAchat));
      quelqueChoseAReprendre = true;
    }
    n.boissons.push(fiche);
  });
  if (quelqueChoseAReprendre) achatsMigration = aReprendre;

  /* Saisies de vente : reprise du modèle précédent, qui ne gardait qu'une
     fiche par journée. Chacune devient un lot attribué à l'appareil d'origine. */
  if (Array.isArray(d.saisies) && d.saisies.length){
    n.saisies = d.saisies.map(x => ({
      id: x.id || ("s" + Math.random().toString(36).slice(2,9)),
      date: x.date, appareil: x.appareil || "reprise",
      compteId: x.compteId || null, nom: x.nom || "—",
      lignes: x.lignes || [], le: x.le || maintenant(), maj: x.maj || maintenant()
    }));
  } else {
    n.saisies = (d.journees || []).map(j => ({
      id: "s" + String(j.date).replace(/-/g,"") + "reprise",
      date: j.date, appareil: "reprise", compteId: null, nom: "reprise",
      lignes: j.lignes || [], le: maintenant(), maj: maintenant()
    }));
  }

  /* Les prix d'achat historiques sont retirés des mouvements : les laisser en
     clair dans les lignes de vente reviendrait à publier ce que le coffre
     protège, y compris dans un fichier de sauvegarde. */
  n.receptions.forEach(r => (r.lignes || []).forEach(l => { delete l.pa; }));
  n.saisies.forEach(x => (x.lignes || []).forEach(l => { delete l.pa; }));
  n.inventaires.forEach(i => (i.lignes || []).forEach(l => { delete l.pa; }));

  n.saisies.sort((a,b)=>a.date.localeCompare(b.date));
  n.inventaires.sort((a,b)=>a.date.localeCompare(b.date));
  return n;
}

/* Reprise des données de la version 1 : les entrées deviennent des
   réceptions groupées par date et fournisseur, les ventes des journées. */
function migrerV1(v1){
  const recs = new Map();
  (v1.entrees||[]).forEach(e=>{
    const cle = e.date + "|" + (e.fournisseur||"");
    if (!recs.has(cle)) recs.set(cle, {id:"r"+recs.size, date:e.date, fournisseur:e.fournisseur||"", lignes:[]});
    recs.get(cle).lignes.push({boissonId:e.boissonId, nom:e.nomBoisson||"", qte:e.qte, pa:e.prixAchat||0});
  });
  const jours = new Map();
  (v1.ventes||[]).forEach(v=>{
    if (!jours.has(v.date)) jours.set(v.date, {date:v.date, lignes:[]});
    const j = jours.get(v.date);
    const dejà = j.lignes.find(l=>l.boissonId===v.boissonId && l.pu===v.pu);
    if (dejà) dejà.qte += v.qte;
    else j.lignes.push({boissonId:v.boissonId, nom:v.nomBoisson||"", qte:v.qte, pu:v.pu, pa:v.prixAchat||0});
  });
  return normaliser({
    dateDepart: v1.dateDepart || null,
    boissons: v1.boissons,
    receptions: [...recs.values()],
    journees: [...jours.values()],
    saisies: [],
    inventaires: (v1.inventaires||[]).map(inv=>({
      id: inv.id, date: inv.date, refLibelle: "origine",
      lignes: (inv.lignes||[]).map(l=>({
        boissonId:l.boissonId, nom:l.nom, base:l.theorique, baseDate:inv.date,
        entrees:0, ventes:0, theorique:l.theorique, reel:l.reel, ecart:l.ecart,
        pa:l.prixAchat||0, pv:0
      }))
    })),
    compteur: v1.compteur || 1
  });
}

async function demarrer(){
  const sauve = await Depot.lire(CLE);
  if (sauve && Array.isArray(sauve.boissons) && sauve.boissons.length){
    D = normaliser(sauve);
  } else {
    const v1 = await Depot.lire(CLE_V1);
    if (v1 && Array.isArray(v1.boissons) && v1.boissons.length
        && ((v1.ventes||[]).length || (v1.entrees||[]).length)){
      D = migrerV1(v1);
      messageAccueil = "Données de la version précédente reprises";
    } else {
      D = normaliser({
        dateDepart: aujourdhui(),
        boissons: CATALOGUE_GEBEN.map((nom,i)=>({
          /* identifiant unique à cette installation : deux bars créés
             séparément ne doivent pas partager les mêmes identifiants, sinon
             leurs catalogues se mélangeraient silencieusement à la fusion */
          id:"b"+(i+1)+"-"+Math.random().toString(36).slice(2,9),
          nom, prixAchat:0, prixVente:0, stockInitial:0, seuil:0
        }))
      });
      /* création locale véritable : elle doit primer sur un jeu distant vide */
      D.meta.reglages = maintenant();
      /* annoncé au démarrage réel de l'application, et non par un minuteur qui
         viendrait écraser un message plus important resté à l'écran */
      messageAccueil = CATALOGUE_GEBEN.length + " boissons chargées — fixez les prix pour commencer";
    }
    enregistrer();
  }
  preparerAppareil();
  await Synchro.charger();
  appliquerTheme();
  demanderDurabilite();
  if (!D.comptes.length){ ecranBienvenue(); return; }
  ecranConnexion();
  /* Un appareil déjà rattaché va chercher les nouveautés avant toute connexion :
     sans cela, un compte créé entre-temps par l'administrateur n'arriverait
     jamais, et son titulaire ne pourrait pas se connecter. */
  if (Synchro.active() && !estDetache() && Synchro.cfg.auto) Synchro.synchroniser(true);
}
demarrer();
</script>
