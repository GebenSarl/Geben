/* =====================================================================
   1. BOISSONS — stock, prix, stock de départ
   ===================================================================== */
let modeBoissons = "liste";

function rendreBoissons(){
  const bs = catalogue();
  const zone = document.getElementById("corpsBoissons");
  const et = etatStock();

  document.getElementById("resBoissons").textContent =
    bs.length ? bs.length + " référence" + (bs.length>1?"s":"")
      + (et.alertes.length ? " · " + et.alertes.length + " à surveiller" : "") : "";

  const bandeaux = [];
  if (estAdmin() && joursDepuisSauvegarde() > 7)
    bandeaux.push('<div class="bandeau" style="border-color:var(--rouge)"><span>'
      + (D.derniereSauvegarde
          ? '<b>Dernière sauvegarde il y a ' + joursDepuisSauvegarde() + ' jours.</b> '
          : '<b>Aucune sauvegarde envoyée.</b> ')
      + 'Les données ne vivent que dans ce téléphone.</span>'
      + '<button id="versSauvegarde">Sauvegarder</button></div>');
  if (invitationInstall && !estInstallee())
    bandeaux.push('<div class="bandeau"><span><b>Installer l\'application</b> sur l\'écran '
      + 'd\'accueil, pour l\'ouvrir sans passer par le navigateur.</span>'
      + '<button id="versInstall">Installer</button></div>');
  const sansPrix = bs.filter(b=>!b.prixVente).length;
  if (sansPrix && modeBoissons!=="prix")
    bandeaux.push('<div class="bandeau"><span><b>'+sansPrix+' boisson'+(sansPrix>1?'s':'')+'</b> sans prix de vente. '
      + 'Sans prix, la recette ne peut pas être calculée.</span>'
      + '<button id="versPrix">Fixer</button></div>');
  document.getElementById("zoneBandeaux").innerHTML = bandeaux.join("");
  const bSauv = document.getElementById("versSauvegarde");
  if (bSauv) bSauv.addEventListener("click", ()=>{ creerSauvegarde(); rendreBoissons(); });
  const bInst = document.getElementById("versInstall");
  if (bInst) bInst.addEventListener("click", lancerInstallation);
  const bPrix = document.getElementById("versPrix");
  if (bPrix) bPrix.addEventListener("click", ()=>{ modeBoissons="prix"; rendreBoissons(); });

  document.querySelectorAll("#segBoissons button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.mode===modeBoissons ? "true":"false"));

  if (!bs.length){
    zone.innerHTML = '<div class="vide"><b>Le catalogue est vide</b>Ajoutez une boisson pour commencer.</div>';
    return;
  }

  if (modeBoissons === "liste"){
    zone.innerHTML = '<div class="liste">' + bs.map(b=>{
      const s = stockDe(b);
      const bouge = aDesMouvements(b.id);
      let cls = "", u = "en stock";
      if (s < 0){ cls="negatif"; u="incohérent"; }
      else if (s === 0 && !bouge && !b.stockInitial){ cls="neutre"; u="à saisir"; }
      else if (s === 0){ cls="rupture"; u="rupture"; }
      else if (b.seuil>0 && s<=b.seuil){ cls="alerte"; u="à commander"; }
      const meta = [b.prixVente?argent(b.prixVente):"prix à définir", b.format, b.marque]
        .filter(Boolean).join(" · ");
      return '<button class="ligne '+cls+'" data-nom="'+ech(b.nom.toLowerCase())+'" data-modifier="'+b.id+'">'
        + '<span class="corps"><span class="nom">'+ech(b.nom)+'</span>'
        + '<span class="meta">'+ech(meta)+'</span></span>'
        + '<span class="chiffre"><span class="q num">'+nombre(s)+'</span><span class="u">'+u+'</span></span>'
        + '</button>';
    }).join("") + '</div>'
    + (voitAchats()
        ? '<div class="titre"><span>Valeur du stock au prix d\'achat</span>'
          + '<b class="num">'+argent(et.valeurAchat)+'</b></div>'
        : '<div class="titre"><span>Valeur du stock au prix de vente</span>'
          + '<b class="num">'+argent(et.valeurVente)+'</b></div>');

    zone.querySelectorAll("[data-modifier]").forEach(el=>
      el.addEventListener("click", ()=>formulaireBoisson(el.dataset.modifier)));
  }

  else if (modeBoissons === "prix"){
    /* un utilisateur non administrateur ne voit ni la colonne Achat ni la marge :
       la valeur n'est pas seulement masquée, elle n'est pas déchiffrée */
    const avecAchat = voitAchats();
    zone.innerHTML =
      '<div class="gr-entete" style="grid-template-columns:1fr '+(avecAchat?'58px 58px':'58px')+'">'
      + '<span>Boisson</span>'+(avecAchat?'<span>Achat</span>':'')+'<span>Vente</span></div>'
      + bs.map(b=>
          '<div class="gr'+(avecAchat?' trois':'')+'" data-nom="'+ech(b.nom.toLowerCase())+'">'
          + '<span class="gr-nom"><span>'+ech(b.nom)+'</span>'
          + '<small'+(b.prixVente?'':' class="manque"')+'>'
          + (b.prixVente
              ? (avecAchat ? "marge "+argent(b.prixVente - prixAchatDe(b)) : "prix de vente")
              : "prix de vente à définir")
          + '</small></span>'
          + (avecAchat
              ? '<input type="number" inputmode="numeric" min="0" step="5" data-pa="'+b.id+'" '
                + 'value="'+(prixAchatDe(b)||"")+'" placeholder="0" aria-label="Prix d\'achat '+ech(b.nom)+'">'
              : '')
          + '<input type="number" inputmode="numeric" min="0" step="5" data-pv="'+b.id+'" '
          + 'value="'+(b.prixVente||"")+'" placeholder="0" aria-label="Prix de vente '+ech(b.nom)+'">'
          + '</div>').join("")
      + '<div class="zone"><p class="aide">'
      + (avecAchat
          ? 'Les prix sont enregistrés au fur et à mesure de la saisie. Les prix d\'achat sont '
            + 'chiffrés et ne sont lisibles que par l\'administrateur.'
          : 'Les prix d\'achat et les marges sont réservés à l\'administrateur.')
      + '</p></div>';

    zone.querySelectorAll("[data-pa],[data-pv]").forEach(inp=>{
      inp.addEventListener("change", async ()=>{
        const b = boisson(inp.dataset.pa || inp.dataset.pv);
        if (!b) return;
        const valeur = Math.max(0, Math.round(+inp.value||0));
        if (inp.dataset.pa){
          if (!voitAchats()) return;
          achats[b.id] = valeur;
          await ecrireCoffre();
        } else {
          b.prixVente = valeur;
          touche(b); enregistrer();
        }
        const pt = inp.closest(".gr").querySelector("small");
        if (b.prixVente){
          pt.textContent = voitAchats() ? "marge "+argent(b.prixVente - prixAchatDe(b)) : "prix de vente";
          pt.className = "";
        } else { pt.textContent = "prix de vente à définir"; pt.className = "manque"; }
      });
    });
  }

  else if (modeBoissons === "depart"){
    zone.innerHTML =
      '<div class="gr-entete" style="grid-template-columns:1fr 58px">'
      + '<span>Boisson</span><span>Départ</span></div>'
      + bs.map(b=>{
          const r = reference(b.id, null);
          return '<div class="gr" data-nom="'+ech(b.nom.toLowerCase())+'">'
          + '<span class="gr-nom"><span>'+ech(b.nom)+'</span><small>'
          + (r.depart ? "au "+dateCourte(D.dateDepart)
                      : "figé par l'"+r.libelle+" ("+nombre(r.base)+")")
          + '</small></span>'
          + '<input type="number" inputmode="numeric" min="0" step="1" data-si="'+b.id+'" '
          + 'value="'+(b.stockInitial||"")+'" placeholder="0"'+(r.depart?"":" disabled")
          + ' aria-label="Stock de départ '+ech(b.nom)+'"></div>';
        }).join("")
      + '<div class="zone"><label><span class="lib">Date de mise en service</span>'
      + '<input type="date" id="champDepart" value="'+D.dateDepart+'"></label>'
      + '<p class="aide" style="margin-top:10px">Le stock de départ est la quantité en magasin le jour où '
      + 'vous commencez à utiliser l\'application. Après un premier inventaire validé, c\'est le stock '
      + 'compté qui sert de point de départ et ce champ n\'agit plus.</p></div>';

    zone.querySelectorAll("[data-si]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const b = boisson(inp.dataset.si); if (!b) return;
        b.stockInitial = Math.max(0, Math.round(+inp.value||0));
        touche(b); enregistrer();
      });
    });
    document.getElementById("champDepart").addEventListener("change", e=>{
      D.dateDepart = e.target.value || aujourdhui();
      D.meta.reglages = maintenant();
      enregistrer(); rendreBoissons();
    });
  }

  else { /* renommer */
    zone.innerHTML =
      '<div class="gr-entete" style="grid-template-columns:1fr"><span>Nom de la boisson</span></div>'
      + bs.map(b=>
          '<div class="gr" data-nom="'+ech(b.nom.toLowerCase())+'" style="grid-template-columns:1fr">'
          + '<input type="text" data-nm="'+b.id+'" value="'+ech(b.nom)+'" '
          + 'autocomplete="off" spellcheck="false" aria-label="Nom de '+ech(b.nom)+'"></div>').join("")
      + '<div class="zone"><p class="aide">Corrigez un nom et il est enregistré dès que vous quittez '
      + 'le champ. L\'historique des ventes, des entrées et des inventaires suit automatiquement : '
      + 'renommer ne casse rien. Deux boissons ne peuvent pas porter le même nom.</p></div>';

    zone.querySelectorAll("[data-nm]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const b = boisson(inp.dataset.nm); if (!b) return;
        const nouveau = inp.value.trim();
        if (!nouveau){ inp.value = b.nom; signaler("Le nom ne peut pas être vide"); return; }
        if (nouveau === b.nom) return;
        const doublon = D.boissons.find(x=> x.id!==b.id && x.nom.toLowerCase()===nouveau.toLowerCase());
        if (doublon){ inp.value = b.nom; signaler(nouveau + " existe déjà dans le catalogue"); return; }
        const ancien = b.nom;
        b.nom = nouveau; touche(b);
        inp.closest(".gr").dataset.nom = nouveau.toLowerCase();
        enregistrer();
        signaler(ancien + " renommée en " + nouveau);
      });
    });
  }

  const flt = document.getElementById("fltBoissons");
  brancherFiltre(flt, zone);
  if (flt.value) flt.dispatchEvent(new Event("input"));
}

document.querySelectorAll("#segBoissons button").forEach(b=>
  b.addEventListener("click", ()=>{ modeBoissons = b.dataset.mode; rendreBoissons(); }));

function formulaireBoisson(bid){
  const b = bid ? boisson(bid) : null;
  const v = (k,d)=> (b && b[k]!=null ? b[k] : (d==null?"":d));
  const s = b ? stockDe(b) : 0;
  const r = b ? reference(b.id, null) : null;

  ouvrirFeuille(
    "<h2>" + (b ? ech(b.nom) : "Nouvelle boisson") + "</h2>"
    + '<label><span class="lib">Nom</span><input id="fNom" value="'+ech(v("nom"))+'" '
    +   'placeholder="FLAG GM" autocomplete="off"></label>'
    + '<div class="deux">'
    +   '<label><span class="lib">Marque (facultatif)</span><input id="fMarque" value="'+ech(v("marque"))+'" autocomplete="off"></label>'
    +   '<label><span class="lib">Format (facultatif)</span><input id="fFormat" value="'+ech(v("format"))+'" autocomplete="off"></label>'
    + '</div>'
    + (voitAchats()
        ? '<div class="deux">'
          + '<label><span class="lib">Prix d\'achat</span><input id="fPa" type="number" '
          + 'inputmode="numeric" min="0" step="5" value="'+(b?(prixAchatDe(b)||""):"")+'" placeholder="0"></label>'
          + '<label><span class="lib">Prix de vente</span><input id="fPv" type="number" '
          + 'inputmode="numeric" min="0" step="5" value="'+v("prixVente","")+'" placeholder="0"></label>'
          + '</div><p class="aide" id="fMarge"></p>'
        : '<label><span class="lib">Prix de vente</span><input id="fPv" type="number" '
          + 'inputmode="numeric" min="0" step="5" value="'+v("prixVente","")+'" placeholder="0"></label>'
          + '<p class="aide">Le prix d\'achat et la marge sont réservés à l\'administrateur.</p>')
    + '<div class="deux">'
    +   '<label><span class="lib">'+(b && r && !r.depart ? "Stock actuel (calculé)" : "Stock de départ")+'</span>'
    +   (b && r && !r.depart
          ? '<input value="'+nombre(s)+'" disabled>'
          : '<input id="fSi" type="number" inputmode="numeric" min="0" step="1" value="'+v("stockInitial","")+'" placeholder="0">')+'</label>'
    +   '<label><span class="lib">Alerte en dessous de</span><input id="fSeuil" type="number" inputmode="numeric" min="0" step="1" value="'+v("seuil","")+'" placeholder="0"></label>'
    + '</div>'
    + (b && r && !r.depart
        ? '<p class="aide">Stock calculé depuis l\'' + r.libelle + ' (' + nombre(r.base) + ' comptés), '
          + 'plus les entrées, moins les ventes. Pour le corriger, passez par l\'inventaire.</p>'
        : '')
    + '<button class="btn" id="fOk">'+(b?"Enregistrer":"Ajouter au catalogue")+'</button>'
    + (b ? '<button class="btn btn-danger" id="fDel">Supprimer du catalogue</button>' : "")
    + '<button class="btn btn-fant" id="fNon">Annuler</button>',
  ()=>{
    const nom=document.getElementById("fNom"), pa=document.getElementById("fPa"),
          pv=document.getElementById("fPv"), mg=document.getElementById("fMarge");
    function majMarge(){
      if (!pa || !mg) return;
      const m = (+pv.value||0) - (+pa.value||0);
      mg.innerHTML = (!pv.value && !pa.value) ? "" :
        "Marge par unité : <b>"+argent(m)+"</b>" + (m<0 ? " — vous vendez à perte" : "");
    }
    if (pa) pa.addEventListener("input", majMarge);
    pv.addEventListener("input", majMarge); majMarge();
    if (!b) setTimeout(()=>nom.focus(), 280);
    document.getElementById("fNon").addEventListener("click", fermerFeuille);

    document.getElementById("fOk").addEventListener("click", async ()=>{
      const champSi = document.getElementById("fSi");
      const d = {
        nom: nom.value.trim(),
        marque: document.getElementById("fMarque").value.trim(),
        format: document.getElementById("fFormat").value.trim(),
        prixVente: Math.max(0, Math.round(+pv.value||0)),
        seuil: Math.max(0, Math.round(+document.getElementById("fSeuil").value||0))
      };
      if (champSi) d.stockInitial = Math.max(0, Math.round(+champSi.value||0));
      if (!d.nom){ signaler("Indiquez le nom de la boisson"); nom.focus(); return; }
      const doublon = D.boissons.find(x=> x.nom.toLowerCase()===d.nom.toLowerCase() && (!b || x.id!==b.id));
      if (doublon){ signaler(d.nom + " existe déjà dans le catalogue"); return; }

      let cible = b;
      if (b){ Object.assign(b, d); touche(b); signaler(b.nom + " modifiée"); }
      else {
        cible = touche(Object.assign({id:id(), stockInitial:d.stockInitial||0}, d));
        D.boissons.push(cible);
        signaler(d.nom + " ajoutée");
      }
      if (voitAchats() && pa){
        achats[cible.id] = Math.max(0, Math.round(+pa.value||0));
        await ecrireCoffre();
      }
      enregistrer(); fermerFeuille(); rafraichir();
    });

    if (b) document.getElementById("fDel").addEventListener("click", ()=>{
      const n = D.receptions.reduce((s,r)=>s+r.lignes.filter(l=>l.boissonId===b.id).length,0)
              + D.saisies.reduce((s,x)=>s+x.lignes.filter(l=>l.boissonId===b.id).length,0);
      if (!confirm(n ? b.nom+" a "+n+" mouvement(s) enregistré(s), qui resteront dans les rapports. Supprimer du catalogue ?"
                     : "Supprimer "+b.nom+" du catalogue ?")) return;
      marquerSupprime("boisson", b.id);
      D.boissons = D.boissons.filter(x=>x.id!==b.id);
      enregistrer(); fermerFeuille(); rafraichir(); signaler(b.nom+" supprimée");
    });
  });
}
document.getElementById("btnAjouter").addEventListener("click", ()=>formulaireBoisson(null));

/* =====================================================================
   2. ENTRÉES DE STOCK — réceptions par bon de livraison
   ===================================================================== */
function rendreEntrees(){
  const zone = document.getElementById("listeReceptions");
  const rs = D.receptions.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const mois = aujourdhui().slice(0,7);
  const total = rs.filter(r=>r.date.slice(0,7)===mois)
                  .reduce((s,r)=> s + r.lignes.reduce((x,l)=>x+l.qte,0), 0);
  document.getElementById("resEntrees").textContent = total ? nombre(total)+" unités ce mois" : "";

  if (!rs.length){
    zone.innerHTML = '<div class="vide"><b>Aucune réception</b>'
      + 'Enregistrez une livraison : le stock augmente pour chaque boisson reçue.</div>';
    return;
  }
  zone.innerHTML = rs.map(r=>{
    const q = r.lignes.reduce((s,l)=>s+l.qte,0);
    const val = voitAchats()
      ? r.lignes.reduce((s,l)=> s + l.qte*prixAchatDe(boisson(l.boissonId)), 0) : 0;
    const meta = [r.lignes.length+" référence"+(r.lignes.length>1?"s":""),
                  r.fournisseur, val?argent(val):""].filter(Boolean).join(" · ");
    return '<div class="ligne">'
      + '<button class="corps" data-ouvrir="'+r.id+'" style="text-align:left">'
      +   '<span class="nom">'+dateLongue(r.date)+'</span><span class="meta">'+ech(meta)+'</span></button>'
      + '<span class="chiffre"><span class="q num" style="color:var(--vert)">+'+nombre(q)+'</span>'
      +   '<span class="u">reçues</span></span>'
      + '<button class="sup" data-suppr="'+r.id+'" aria-label="Supprimer cette réception">&times;</button>'
      + '</div>';
  }).join("");

  zone.querySelectorAll("[data-ouvrir]").forEach(el=>
    el.addEventListener("click", ()=>ouvrirReception(el.dataset.ouvrir)));
  zone.querySelectorAll("[data-suppr]").forEach(el=>
    el.addEventListener("click", ()=>{
      const r = D.receptions.find(x=>x.id===el.dataset.suppr); if(!r) return;
      if (!peutEcrire(r.date)) return;
      const q = r.lignes.reduce((s,l)=>s+l.qte,0);
      if (!confirm("Supprimer la réception du "+dateCourte(r.date)+" ? "+q+" unité(s) seront retirées du stock.")) return;
      marquerSupprime("reception", el.dataset.suppr);
      D.receptions = D.receptions.filter(x=>x.id!==el.dataset.suppr);
      enregistrer(); rafraichir(); signaler("Réception supprimée");
    }));
}

let saisieRecep = {};
function ouvrirReception(rid){
  if (!D.boissons.length){ signaler("Ajoutez d'abord des boissons"); aller("boissons"); return; }
  const r = rid ? D.receptions.find(x=>x.id===rid) : null;
  if (r && estVerrouille(r.date) && !estAdmin()){
    signaler("Réception clôturée : consultation seule");
  }
  saisieRecep = {};
  if (r) r.lignes.forEach(l=> saisieRecep[l.boissonId] = l.qte);
  const fournisseurs = [...new Set(D.receptions.map(x=>x.fournisseur).filter(Boolean))];
  const bs = catalogue();

  ouvrirFeuille(
    "<h2>" + (r ? "Réception du "+dateCourte(r.date) : "Nouvelle réception") + "</h2>"
    + '<div class="deux">'
    +   '<label><span class="lib">Date de réception</span><input type="date" id="rDate" value="'+(r?r.date:aujourdhui())+'"></label>'
    +   '<label><span class="lib">Fournisseur</span><input id="rFour" list="lstFour" autocomplete="off" value="'+ech(r?r.fournisseur:"")+'" placeholder="Dépôt"></label>'
    + '</div>'
    + '<datalist id="lstFour">'+fournisseurs.map(f=>'<option value="'+ech(f)+'">').join("")+'</datalist>'
    + '<label><span class="lib">Chercher une boisson</span><input type="search" id="rFlt" placeholder="Nom de la boisson" autocomplete="off"></label>'
    + '<div id="rGrille" style="margin:0 calc(var(--pad) * -1) 12px;border-top:1px solid var(--filet)">'
    + bs.map(b=>
        '<div class="gr" data-nom="'+ech(b.nom.toLowerCase())+'">'
        + '<span class="gr-nom"><span>'+ech(b.nom)+'</span>'
        + '<small>en stock '+nombre(stockDe(b))
        + (voitAchats() && prixAchatDe(b) ? " · achat "+argent(prixAchatDe(b)) : "")+'</small></span>'
        + '<input type="number" inputmode="numeric" min="0" step="1" data-q="'+b.id+'" '
        + 'value="'+(saisieRecep[b.id]||"")+'" placeholder="0" aria-label="Quantité reçue '+ech(b.nom)+'"></div>').join("")
    + '</div>'
    + '<p class="aide" id="rResume"></p>'
    + '<button class="btn" id="rOk">'+(r?"Enregistrer les modifications":"Valider la réception")+'</button>'
    + '<button class="btn btn-fant" id="rNon">Annuler</button>',
  ()=>{
    const grille = document.getElementById("rGrille");
    const resume = document.getElementById("rResume");
    function majResume(){
      let q=0, n=0, val=0;
      Object.keys(saisieRecep).forEach(bid=>{
        const v = saisieRecep[bid]; if (!v) return;
        const b = boisson(bid); q += v; n++;
        if (voitAchats()) val += v * prixAchatDe(b);
      });
      resume.innerHTML = n
        ? n+" référence"+(n>1?"s":"")+" · <b>"+nombre(q)+" unités</b>"+(val?" · valeur "+argent(val):"")
        : "Saisissez les quantités reçues. Les boissons laissées vides ne sont pas concernées.";
    }
    grille.querySelectorAll("[data-q]").forEach(inp=>
      inp.addEventListener("input", ()=>{
        const v = Math.max(0, Math.round(+inp.value||0));
        if (v) saisieRecep[inp.dataset.q] = v; else delete saisieRecep[inp.dataset.q];
        majResume();
      }));
    brancherFiltre(document.getElementById("rFlt"), grille);
    majResume();

    document.getElementById("rNon").addEventListener("click", fermerFeuille);
    document.getElementById("rOk").addEventListener("click", ()=>{
      const date = document.getElementById("rDate").value || aujourdhui();
      const four = document.getElementById("rFour").value.trim();
      const lignes = Object.keys(saisieRecep).filter(bid=>saisieRecep[bid]>0).map(bid=>{
        const b = boisson(bid);
        return { boissonId:bid, nom:b?b.nom:"", qte:saisieRecep[bid] };
      });
      if (!lignes.length){ signaler("Aucune quantité saisie"); return; }
      if (!peutEcrire(date)) return;
      if (r && r.date !== date && !peutEcrire(r.date)) return;
      if (r){ r.date=date; r.fournisseur=four; r.lignes=lignes; touche(r); }
      else D.receptions.push(touche({ id:id(), date, fournisseur:four, lignes,
             nom: session ? session.nom : "—", le: maintenant() }));
      enregistrer(); fermerFeuille(); rafraichir();
      signaler(nombre(lignes.reduce((s,l)=>s+l.qte,0)) + " unités entrées en stock");
    });
  });
}
document.getElementById("btnReception").addEventListener("click", ()=>ouvrirReception(null));

/* =====================================================================
   3. VENTES JOURNALIÈRES — une saisie par date
   ===================================================================== */
let dateVentes = aujourdhui();
let saisieVentes = {};

function chargerJournee(date){
  /* on ne charge que la saisie de CE téléphone : celles des autres appareils
     sont affichées à côté mais ne sont jamais modifiées d'ici */
  saisieVentes = {};
  const x = maSaisie(date);
  if (x) x.lignes.forEach(l=> saisieVentes[l.boissonId] = { qte:l.qte, pu:l.pu });
}

function rendreVentes(){
  const champ = document.getElementById("dateVentes");
  if (champ.value !== dateVentes) champ.value = dateVentes;
  const bs = catalogue();
  const x = maSaisie(dateVentes);
  const autres = saisiesDe(dateVentes).filter(y => y.appareil !== APPAREIL);

  document.getElementById("resVentes").textContent =
    (dateVentes===aujourdhui() ? "Aujourd'hui" : dateLongue(dateVentes))
    + (x ? " · ma saisie enregistrée" : "")
    + (autres.length ? " · " + autres.length + " autre"+(autres.length>1?"s":"")+" appareil"
        +(autres.length>1?"s":"") : "");

  const grille = document.getElementById("grilleVentes");
  if (!bs.length){
    grille.innerHTML = '<div class="vide"><b>Aucune boisson au catalogue</b>Ajoutez vos boissons d\'abord.</div>';
    return;
  }
  grille.innerHTML = bs.map(b=>{
    const e = saisieVentes[b.id];
    const pu = e ? e.pu : b.prixVente;
    const ailleurs = qteAutresAppareils(dateVentes, b.id);
    return '<div class="gr" data-nom="'+ech(b.nom.toLowerCase())+'" style="grid-template-columns:1fr 58px 62px">'
      + '<span class="gr-nom"><span>'+ech(b.nom)+'</span>'
      + '<small'+(pu?'':' class="manque"')+'>'
      + (pu ? argent(pu)+" l'unité · stock "+nombre(stockDe(b)) : "prix de vente à définir")
      + (ailleurs ? ' · <b style="color:var(--accent)">+'+nombre(ailleurs)+' ailleurs</b>' : '')
      + '</small></span>'
      + '<input type="number" inputmode="numeric" min="0" step="1" data-v="'+b.id+'" '
      + 'value="'+(e&&e.qte?e.qte:"")+'" placeholder="0" aria-label="Quantité vendue '+ech(b.nom)+'">'
      + '<span class="gr-mt num" data-mt="'+b.id+'">'+(e&&e.qte?argent(e.qte*pu):"—")+'</span>'
      + '</div>';
  }).join("");

  document.getElementById("avisVentes").innerHTML = avisVerrou(dateVentes);
  const fige = estVerrouille(dateVentes) && !estAdmin();
  if (fige){
    grille.querySelectorAll("[data-v]").forEach(inp => inp.setAttribute("disabled",""));
    document.getElementById("btnValiderVentes").setAttribute("disabled","");
    document.getElementById("btnEffacerVentes").setAttribute("disabled","");
  } else {
    document.getElementById("btnEffacerVentes").removeAttribute("disabled");
  }

  grille.querySelectorAll("[data-v]").forEach(inp=>
    inp.addEventListener("input", ()=>{
      const bid = inp.dataset.v, b = boisson(bid);
      const q = Math.max(0, Math.round(+inp.value||0));
      const pu = saisieVentes[bid] ? saisieVentes[bid].pu : (b?b.prixVente:0);
      if (q) saisieVentes[bid] = { qte:q, pu };
      else delete saisieVentes[bid];
      const cel = grille.querySelector('[data-mt="'+bid+'"]');
      if (cel) cel.textContent = q ? argent(q*pu) : "—";
      majTotalVentes();
    }));

  brancherFiltre(document.getElementById("fltVentes"), grille);
  majTotalVentes();
}

function majTotalVentes(){
  let ca=0, q=0, n=0;
  Object.keys(saisieVentes).forEach(bid=>{
    const e = saisieVentes[bid]; if (!e || !e.qte) return;
    ca += e.qte*e.pu; q += e.qte; n++;
  });
  if (estVerrouille(dateVentes) && !estAdmin()){
    document.getElementById("btnValiderVentes").setAttribute("disabled","");
  }
  const totalJour = recetteDu(dateVentes);
  const partAutres = totalJour - ca;
  document.getElementById("totalVentes").textContent = argent(ca);
  document.getElementById("totalVentesTxt").textContent =
    (n ? nombre(q)+" unités sur "+n+" référence"+(n>1?"s":"") : "Aucune vente sur ce téléphone")
    + (partAutres > 0 ? " · journée entière " + argent(totalJour) : "");
  const btn = document.getElementById("btnValiderVentes");
  btn.textContent = maSaisie(dateVentes) ? "Mettre à jour" : "Enregistrer";
}

document.getElementById("dateVentes").addEventListener("change", e=>{
  dateVentes = e.target.value || aujourdhui();
  chargerJournee(dateVentes);
  rendreVentes();
});

document.getElementById("btnValiderVentes").addEventListener("click", ()=>{
  if (!peutEcrire(dateVentes)) return;
  const lignes = Object.keys(saisieVentes).filter(bid=>saisieVentes[bid].qte>0).map(bid=>{
    const b = boisson(bid);
    return { boissonId:bid, nom:b?b.nom:"", qte:saisieVentes[bid].qte, pu:saisieVentes[bid].pu };
  });
  const sansPrix = lignes.filter(l=>!l.pu);
  if (sansPrix.length && !confirm(
      sansPrix.length+" boisson(s) vendue(s) sans prix de vente ne compteront pas dans la recette. Continuer ?")) return;

  const existante = maSaisie(dateVentes);
  if (!lignes.length){
    if (!existante){ signaler("Aucune vente saisie"); return; }
    if (!confirm("Supprimer ma saisie du "+dateCourte(dateVentes)+" ?\n\n"
      + "Les saisies faites depuis les autres téléphones ne sont pas touchées.")) return;
    marquerSupprime("saisie", existante.id);
    D.saisies = D.saisies.filter(y => y.id !== existante.id);
    enregistrer(); rafraichir(); signaler("Ma saisie du jour supprimée"); return;
  }
  if (existante){
    existante.lignes = lignes;
    existante.maj = maintenant();
  } else {
    D.saisies.push({ id:id(), date:dateVentes, appareil:APPAREIL,
                     compteId: session ? session.id : null,
                     nom: session ? session.nom : "—",
                     lignes, le:maintenant(), maj:maintenant() });
    D.saisies.sort((a,b)=>a.date.localeCompare(b.date));
  }
  enregistrer(); rafraichir();
  signaler(argent(lignes.reduce((s,l)=>s+l.qte*l.pu,0)) + " enregistrés pour le " + dateCourte(dateVentes));
});

document.getElementById("btnEffacerVentes").addEventListener("click", ()=>{
  if (!Object.keys(saisieVentes).length){ signaler("La saisie est déjà vide"); return; }
  saisieVentes = {}; rendreVentes(); signaler("Saisie effacée");
});

/* =====================================================================
   4. INVENTAIRE — période délimitée par l'inventaire précédent
   Théorique = stock de référence + entrées de la période − ventes de la période
   ===================================================================== */
let invRefCle = null, invDate = null, invSaisie = {};

function pointsReference(){
  const pts = [{ cle:"depart", date:D.dateDepart, libelle:"Mise en service du "+dateCourte(D.dateDepart) }];
  inventairesValides().forEach(inv=> pts.push({
    cle:inv.id, date:inv.date,
    libelle:"Inventaire du "+dateCourte(inv.date)+" ("+inv.lignes.length+" boissons)"
  }));
  return pts;
}
function refChoisie(){
  const pts = pointsReference();
  return pts.find(p=>p.cle===invRefCle) || pts[pts.length-1];
}
/* Référence propre à une boisson : si elle n'était pas comptée dans
   l'inventaire choisi, on remonte au précédent où elle l'était. */
function refBoisson(bid, pt){
  if (pt.cle === "depart"){
    const b = boisson(bid);
    return { base:(b && b.stockInitial)||0, date:D.dateDepart, depart:true, libelle:"mise en service" };
  }
  return reference(bid, pt.date);
}
function ligneTheorique(b, pt, dateMax){
  const r = refBoisson(b.id, pt);
  const c = cumulsPeriode(b.id, r, dateMax);
  return { ref:r, entrees:c.entrees, ventes:c.ventes, theorique:r.base + c.entrees - c.ventes };
}

function rendreInventaire(){
  const bs = catalogue();
  const pts = pointsReference();
  if (!invDate) invDate = aujourdhui();
  if (!invRefCle) invRefCle = pts[pts.length-1].cle;
  if (D.comptage && D.comptage.date===invDate && D.comptage.refCle===invRefCle
      && !Object.keys(invSaisie).length) invSaisie = Object.assign({}, D.comptage.valeurs);

  const pt = refChoisie();
  document.getElementById("invReference").innerHTML = pts.map(p=>
    '<option value="'+p.cle+'"'+(p.cle===pt.cle?" selected":"")+'>'+ech(p.libelle)+'</option>').join("");
  document.getElementById("invDate").value = invDate;
  document.getElementById("invPeriode").value =
    (pt.cle==="depart" ? "jusqu'au "+dateCourte(invDate)
                       : "du "+dateCourte(lendemain(pt.date))+" au "+dateCourte(invDate));
  const attente = D.inventaires.filter(i=>!i.valide).length;
  document.getElementById("resInv").textContent =
    attente ? attente+" en attente de validation"
            : (inventairesValides().length
                ? inventairesValides().length+" validé"+(inventairesValides().length>1?"s":"") : "");
  document.getElementById("avisInv").innerHTML = avisVerrou(invDate);

  const grille = document.getElementById("grilleInv");
  if (!bs.length){
    grille.innerHTML = '<div class="vide"><b>Rien à compter</b>Le catalogue est vide.</div>';
    return;
  }
  if (pt.date > invDate){
    grille.innerHTML = '<div class="vide"><b>Dates incohérentes</b>'
      + 'La date du comptage doit être postérieure à l\'inventaire de référence.</div>';
    document.getElementById("resumeInv").innerHTML = "";
    document.getElementById("barreInvTxt").textContent = "Dates incohérentes";
    document.getElementById("barreInvEc").textContent = "—";
    document.getElementById("btnValiderInv").setAttribute("disabled","");
    return;
  }

  grille.innerHTML = bs.map(b=>{
    const t = ligneTheorique(b, pt, invDate);
    const calc = nombre(t.ref.base) + " + " + nombre(t.entrees) + " − " + nombre(t.ventes)
               + " = " + nombre(t.theorique);
    return '<div class="cpt" data-nom="'+ech(b.nom.toLowerCase())+'" data-th="'+t.theorique+'" data-bid="'+b.id+'">'
      + '<div class="cpt-h"><span>'+ech(b.nom)+'</span>'
      + '<input type="number" inputmode="numeric" min="0" step="1" data-c="'+b.id+'" '
      + 'value="'+(invSaisie[b.id]!=null?invSaisie[b.id]:"")+'" placeholder="—" '
      + 'aria-label="Stock réel '+ech(b.nom)+'"></div>'
      + '<div class="cpt-d"><span class="cpt-calc">'+calc+'</span>'
      + '<span class="cpt-ec ec-nul" data-ec="'+b.id+'">à compter</span></div></div>';
  }).join("");

  grille.querySelectorAll("[data-c]").forEach(inp=>
    inp.addEventListener("input", ()=>{
      const v = inp.value.trim();
      if (v==="") delete invSaisie[inp.dataset.c];
      else invSaisie[inp.dataset.c] = Math.max(0, Math.round(+v||0));
      D.comptage = { date:invDate, refCle:invRefCle, valeurs:Object.assign({}, invSaisie) };
      enregistrer();
      majEcarts();
    }));

  brancherFiltre(document.getElementById("fltInv"), grille);
  rendreHistoInv();
  majEcarts();
}

function majEcarts(){
  const grille = document.getElementById("grilleInv");
  let comptes=0, manquants=0, surplus=0, valManquants=0, valSurplus=0, exacts=0;

  grille.querySelectorAll("[data-bid]").forEach(el=>{
    const bid = el.dataset.bid, th = +el.dataset.th;
    const cel = el.querySelector('[data-ec="'+bid+'"]');
    if (invSaisie[bid]==null){ cel.textContent="à compter"; cel.className="cpt-ec ec-nul"; return; }
    comptes++;
    const e = invSaisie[bid] - th;
    const b = boisson(bid);
    if (e<0){ manquants += -e; valManquants += -e * ((b&&b.prixVente)||0); }
    else if (e>0){ surplus += e; valSurplus += voitAchats() ? e * prixAchatDe(b) : 0; }
    else exacts++;
    cel.textContent = e===0 ? "exact" : (e>0?"+":"") + nombre(e);
    cel.className = "cpt-ec " + (e>0?"ec-plus":e<0?"ec-moins":"ec-nul");
  });

  const res = document.getElementById("resumeInv");
  const btn = document.getElementById("btnValiderInv");
  const bTxt = document.getElementById("barreInvTxt");
  const bEc = document.getElementById("barreInvEc");
  bTxt.textContent = comptes
    ? comptes + " comptée" + (comptes>1?"s":"") + " sur " + D.boissons.length
    : "Comptage non commencé";
  /* un surplus est aussi un écart : ne jamais annoncer "aucun écart" tant
     qu'une différence subsiste, dans un sens ou dans l'autre */
  if (!comptes){ bEc.textContent = "—"; bEc.style.color = "var(--muet)"; }
  else if (manquants){ bEc.textContent = "− "+nombre(manquants); bEc.style.color = "var(--rouge)"; }
  else if (surplus){ bEc.textContent = "+ "+nombre(surplus); bEc.style.color = "var(--accent)"; }
  else { bEc.textContent = "aucun écart"; bEc.style.color = "var(--vert)"; }
  if (!comptes){
    res.innerHTML = '<p class="aide" style="margin:0 0 12px">Saisissez le stock réellement compté. '
      + 'Les boissons laissées vides ne seront pas touchées, vous pouvez donc compter en plusieurs passages.</p>';
    btn.setAttribute("disabled","");
    return;
  }
  btn.removeAttribute("disabled");
  res.innerHTML =
    '<div class="bloc" style="margin:0 0 14px"><h3>Résumé des écarts</h3><div class="bloc-corps">'
    + '<div class="stat"><span>Boissons comptées</span><b class="num">'+comptes+' sur '+D.boissons.length+'</b></div>'
    + '<div class="stat"><span>Comptages exacts</span><b class="num">'+exacts+'</b></div>'
    + '<div class="stat"><span>Unités manquantes</span><b class="num'+(manquants?' mal':'')+'">'+nombre(manquants)+'</b></div>'
    + '<div class="stat"><span>Unités en surplus</span><b class="num">'+nombre(surplus)+'</b></div>'
    + '<div class="stat"><span>Manque à gagner estimé</span><b class="num'+(valManquants?' mal':'')+'">'+argent(valManquants)+'</b></div>'
    + '</div></div>';
}

document.getElementById("invReference").addEventListener("change", e=>{
  invRefCle = e.target.value; invSaisie = {}; rendreInventaire();
});
document.getElementById("invDate").addEventListener("change", e=>{
  invDate = e.target.value || aujourdhui(); rendreInventaire();
});
document.getElementById("btnCopierInv").addEventListener("click", ()=>{
  const pt = refChoisie();
  catalogue().forEach(b=> invSaisie[b.id] = Math.max(0, ligneTheorique(b, pt, invDate).theorique));
  D.comptage = { date:invDate, refCle:invRefCle, valeurs:Object.assign({}, invSaisie) };
  enregistrer(); rendreInventaire(); signaler("Théorique recopié — corrigez ce qui diffère");
});
document.getElementById("btnEffacerInv").addEventListener("click", ()=>{
  invSaisie = {}; D.comptage = null; enregistrer(); rendreInventaire(); signaler("Saisie effacée");
});

document.getElementById("btnValiderInv").addEventListener("click", ()=>{
  const pt = refChoisie();
  const lignes = [];
  catalogue().forEach(b=>{
    if (invSaisie[b.id]==null) return;
    const t = ligneTheorique(b, pt, invDate);
    lignes.push({ boissonId:b.id, nom:b.nom, base:t.ref.base, baseDate:t.ref.date,
                  entrees:t.entrees, ventes:t.ventes, theorique:t.theorique,
                  reel:invSaisie[b.id], ecart:invSaisie[b.id]-t.theorique,
                  pv:b.prixVente });
  });
  if (!lignes.length){ signaler("Aucun comptage saisi"); return; }
  const nbEcarts = lignes.filter(l=>l.ecart!==0).length;
  const manquants = lignes.reduce((s,l)=> s + (l.ecart<0 ? -l.ecart : 0), 0);

  if (!peutEcrire(invDate)) return;
  if (!confirm("Enregistrer le comptage du "+dateCourte(invDate)+" ?\n\n"
    + lignes.length+" boisson(s) comptée(s)\n"+nbEcarts+" écart(s), "+manquants+" unité(s) manquante(s)\n\n"
    + (estAdmin()
        ? "Le stock ne sera recalé qu'après validation du rapport."
        : "Le rapport sera transmis à l'administrateur. Le stock ne bouge pas avant sa validation."))) return;

  const inv = touche({ id:id(), date:invDate, refDate:pt.date, refLibelle:pt.libelle,
                lignes, valide:null, saisiPar: session ? session.nom : "—",
                saisiLe: new Date().toISOString() });
  D.inventaires.push(inv);
  D.inventaires.sort((a,b)=>a.date.localeCompare(b.date));
  D.comptage = null; invSaisie = {}; invRefCle = null;
  journaliser("Comptage enregistré",
    dateCourte(invDate)+" · "+lignes.length+" boissons, "+nbEcarts+" écart(s)");
  enregistrer(); rafraichir();

  if (estAdmin()
      && confirm("Valider le rapport maintenant et clôturer la période jusqu'au "
                 + dateCourte(invDate) + " ?\n\nLe stock compté deviendra le point de départ "
                 + "des calculs, et les saisies antérieures seront figées.")){
    validerRapport(inv.id, true);
  } else {
    signaler("Comptage enregistré · en attente de validation");
  }
});

function validerRapport(iid, silencieux){
  const inv = D.inventaires.find(x=>x.id===iid);
  if (!inv || !estAdmin()) return;
  inv.valide = { parCompteId: session ? session.id : null,
                 nom: session ? session.nom : "—", le: new Date().toISOString() };
  touche(inv);
  /* la clôture ne recule jamais : elle retient la date la plus avancée */
  if (!D.verrou || inv.date >= D.verrou.date){
    D.verrou = { date: inv.date, inventaireId: inv.id,
                 parCompteId: inv.valide.parCompteId, nom: inv.valide.nom, le: inv.valide.le };
    D.meta.verrou = maintenant();
  }
  journaliser("Rapport validé",
    "inventaire du "+dateCourte(inv.date)+" · période clôturée jusqu'à cette date");
  /* le rapport validé devient la nouvelle référence proposée au prochain comptage */
  invRefCle = null; invSaisie = {};
  enregistrer(); rafraichir();
  if (!silencieux) fermerFeuille();
  signaler("Rapport validé · période clôturée");
}

function leverCloture(iid){
  const inv = D.inventaires.find(x=>x.id===iid);
  if (!inv || !estAdmin()) return;
  if (!confirm("Lever la validation du rapport du "+dateCourte(inv.date)+" ?\n\n"
    + "Le stock sera recalculé depuis le point de départ précédent et la période "
    + "redeviendra modifiable. L'opération est inscrite au journal.")) return;
  inv.valide = null; touche(inv);
  const restants = inventairesValides();
  const dernier = restants[restants.length-1];
  D.verrou = dernier
    ? { date:dernier.date, inventaireId:dernier.id, parCompteId:dernier.valide.parCompteId,
        nom:dernier.valide.nom, le:dernier.valide.le }
    : null;
  D.meta.verrou = maintenant();
  journaliser("Validation levée", "inventaire du "+dateCourte(inv.date));
  invRefCle = null; invSaisie = {};
  enregistrer(); fermerFeuille(); rafraichir();
  signaler("Validation levée");
}

function rendreHistoInv(){
  const zone = document.getElementById("histoInv");
  if (!D.inventaires.length){ zone.innerHTML = ""; return; }
  const invs = D.inventaires.slice().reverse();
  zone.innerHTML = '<div class="titre"><b>Comptages et rapports</b></div><div class="liste">'
    + invs.map(inv=>{
        const ec = inv.lignes.filter(l=>l.ecart!==0).length;
        const mq = inv.lignes.reduce((s,l)=> s + (l.ecart<0?-l.ecart:0), 0);
        const val = inv.lignes.reduce((s,l)=> s + (l.ecart<0 ? -l.ecart*(l.pv||0) : 0), 0);
        const etat = inv.valide
          ? 'validé par ' + ech(inv.valide.nom)
          : '<span class="etiq etiq-attente">en attente de validation</span>';
        return '<button class="ligne" data-inv="'+inv.id+'">'
          + '<span class="corps"><span class="nom">'+dateLongue(inv.date)+'</span>'
          + '<span class="meta">'+inv.lignes.length+' comptées · '+ec+' écart'+(ec>1?"s":"")
          + (val?' · '+argent(val)+' de manque':'')+'</span>'
          + '<span class="meta">'+etat+'</span></span>'
          + '<span class="chiffre"><span class="q num" style="font-size:1.25rem;color:'
          + (mq?"var(--rouge)":"var(--vert)")+'">'+(mq?"−"+nombre(mq):"0")+'</span>'
          + '<span class="u">manquantes</span></span></button>';
      }).join("") + '</div>';
  zone.querySelectorAll("[data-inv]").forEach(el=>
    el.addEventListener("click", ()=>detailInventaire(el.dataset.inv)));
}

function detailInventaire(iid){
  const inv = D.inventaires.find(x=>x.id===iid); if (!inv) return;
  const ecarts = inv.lignes.filter(l=>l.ecart!==0).sort((a,b)=>a.ecart-b.ecart);
  ouvrirFeuille(
    "<h2>Inventaire du "+dateCourte(inv.date)+"</h2>"
    + '<p class="aide">Période analysée : à partir de l\'' + ech(inv.refLibelle||"origine").toLowerCase()
    + '. Calcul appliqué à chaque boisson : stock de référence + entrées − ventes.</p>'
    + (ecarts.length
        ? '<table><thead><tr><th>Boisson</th><th>Théor.</th><th>Réel</th><th>Écart</th></tr></thead><tbody>'
          + ecarts.map(l=>'<tr><td>'+ech(l.nom)+'</td><td class="num">'+nombre(l.theorique)
            + '</td><td class="num">'+nombre(l.reel)+'</td><td class="num" style="color:'
            + (l.ecart<0?"var(--rouge)":"var(--vert)")+'">'+(l.ecart>0?"+":"")+nombre(l.ecart)
            + '</td></tr>').join("")
          + '</tbody></table>'
        : '<p class="aide">Aucun écart : tous les comptages correspondaient au théorique.</p>')
    + (inv.valide
        ? '<p class="aide" style="margin-top:14px"><b>Rapport validé</b> par '
          + ech(inv.valide.nom) + ' le ' + horodatage(inv.valide.le)
          + '. Le stock compté sert de point de départ aux calculs, et les saisies jusqu\'au '
          + dateCourte(inv.date) + ' sont figées.</p>'
          + (estAdmin() ? '<button class="btn btn-fant" id="iLever">Lever la validation</button>' : '')
        : '<p class="aide" style="margin-top:14px">Comptage saisi par '
          + ech(inv.saisiPar || "—")
          + (inv.saisiLe ? ' le ' + horodatage(inv.saisiLe) : '')
          + '. <b>En attente de validation</b> : le stock n\'est pas encore recalé.</p>'
          + (estAdmin()
              ? '<button class="btn" id="iValider">Valider le rapport et clôturer la période</button>'
              : '<p class="aide">Seul l\'administrateur peut valider ce rapport.</p>'))
    + '<button class="btn btn-fant" id="iImp" style="margin-top:9px">Imprimer ce rapport</button>'
    + (estAdmin() ? '<button class="btn btn-danger" id="iDel">Supprimer ce comptage</button>' : '')
    + '<button class="btn btn-fant" id="iNon">Fermer</button>',
  ()=>{
    document.getElementById("iNon").addEventListener("click", fermerFeuille);
    document.getElementById("iImp").addEventListener("click", ()=>imprimerInventaire(inv));
    const bv = document.getElementById("iValider");
    if (bv) bv.addEventListener("click", ()=>validerRapport(iid, false));
    const bl = document.getElementById("iLever");
    if (bl) bl.addEventListener("click", ()=>leverCloture(iid));
    const bd = document.getElementById("iDel");
    if (bd) bd.addEventListener("click", ()=>{
      if (inv.valide && !confirm("Ce rapport est validé. Le supprimer lèvera aussi la clôture. Continuer ?")) return;
      if (!confirm("Supprimer ce comptage ? Les stocks seront recalculés depuis le point de départ précédent.")) return;
      marquerSupprime("inventaire", iid);
      D.inventaires = D.inventaires.filter(x=>x.id!==iid);
      const restants = inventairesValides();
      const dernier = restants[restants.length-1];
      D.verrou = dernier
        ? { date:dernier.date, inventaireId:dernier.id, parCompteId:dernier.valide.parCompteId,
            nom:dernier.valide.nom, le:dernier.valide.le }
        : null;
      invRefCle = null;
      journaliser("Comptage supprimé", dateCourte(inv.date));
      enregistrer(); fermerFeuille(); rafraichir(); signaler("Comptage supprimé");
    });
  });
}

   5. RAPPORTS

function telecharger(nom, contenu, type){
  const blob = new Blob([contenu], {type:type+";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  signaler(nom + " téléchargé");
}
function versCSV(lignes){
  const cel = c=>{ const s=String(c==null?"":c); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return "\uFEFF" + lignes.map(l=>l.map(cel).join(";")).join("\r\n");
}
const suffixe = () => aujourdhui().replace(/-/g,"");

function exporterStock(){
  const et = etatStock();
  const avecAchat = voitAchats();
  const l = [[(D.etablissement+" — Stock au ")+dateLongue(aujourdhui())],
    ["Édité par " + (session ? session.nom : "—")],[],
    avecAchat
      ? ["Boisson","Stock","Prix d'achat","Prix de vente","Valeur achat","Valeur vente","Référence du calcul"]
      : ["Boisson","Stock","Prix de vente","Valeur vente","Référence du calcul"]];
  et.lignes.forEach(b=>{
    const r = reference(b.id, null), s = stockDe(b);
    l.push(avecAchat
      ? [b.nom, s, prixAchatDe(b), b.prixVente, s*prixAchatDe(b), s*b.prixVente,
         r.libelle+" ("+nombre(r.base)+")"]
      : [b.nom, s, b.prixVente, s*b.prixVente, r.libelle+" ("+nombre(r.base)+")"]);
  });
  l.push([], avecAchat
    ? ["Total", et.unites, "", "", et.valeurAchat, et.valeurVente, ""]
    : ["Total", et.unites, "", et.valeurVente, ""]);
  telecharger("GEBEN-stock-"+suffixe()+".csv", versCSV(l), "text/csv");
}

function exporterActivite(){
  const a = activite(periode.debut, periode.fin);
  const l = [[(D.etablissement+" — Point d'activité")],
    ["Du "+dateLongue(a.debut)+" au "+dateLongue(a.fin)],[],
    ["Chiffre d'affaires", a.ca]]
    .concat(voitAchats() ? [["Marge brute estimée", a.marge]] : [])
    .concat([["Unités vendues", a.vendues],["Unités reçues", a.recues]])
    .concat(voitAchats() ? [["Achats de marchandise", a.achats]] : [])
    .concat([["Jours de vente saisis", a.jours],[],
      voitAchats()
        ? ["Boisson","Unités vendues","Unités reçues","Chiffre d'affaires","Marge"]
        : ["Boisson","Unités vendues","Unités reçues","Chiffre d'affaires"]]);
  a.lignes.forEach(x=> l.push(voitAchats()
    ? [x.nom, x.vendues, x.recues, x.ca, x.marge]
    : [x.nom, x.vendues, x.recues, x.ca]));
  l.push(voitAchats() ? ["Total", a.vendues, a.recues, a.ca, a.marge]
                      : ["Total", a.vendues, a.recues, a.ca]);

  l.push([], ["Ventes jour par jour"], ["Date","Boisson","Quantité","Prix unitaire","Montant"]);
  /* l'en-tête est remplacé juste après pour inclure l'auteur de la saisie */
  l[l.length-1] = ["Date","Saisi par","Boisson","Quantité","Prix unitaire","Montant"];
  D.saisies.filter(j=>j.date>=a.debut&&j.date<=a.fin)
    .sort((x,y)=>x.date.localeCompare(y.date))
    .forEach(j=> j.lignes.forEach(x=>{
      const b = boisson(x.boissonId);
      l.push([j.date, j.nom||"—", b?b.nom:x.nom, x.qte, x.pu, x.qte*x.pu]);
    }));

  l.push([], ["Entrées de stock"], ["Date","Fournisseur","Boisson","Quantité"]);
  D.receptions.filter(r=>r.date>=a.debut&&r.date<=a.fin)
    .sort((x,y)=>x.date.localeCompare(y.date))
    .forEach(r=> r.lignes.forEach(x=>{
      const b = boisson(x.boissonId);
      l.push([r.date, r.fournisseur, b?b.nom:x.nom, x.qte]);
    }));

  telecharger("GEBEN-activite-"+a.debut.replace(/-/g,"")+"-"+a.fin.replace(/-/g,"")+".csv",
              versCSV(l), "text/csv");
}

function exporterInventaire(inv){
  if (!inv) return;
  const l = [[(D.etablissement+" — Inventaire du ")+dateLongue(inv.date)],
    ["Point de départ : "+(inv.refLibelle||"origine")],[],
    ["Boisson","Stock de référence","Entrées période","Ventes période","Stock théorique","Stock réel","Écart","Valeur de l'écart"]];
  inv.lignes.forEach(x=> l.push([x.nom, x.base, x.entrees, x.ventes, x.theorique, x.reel, x.ecart,
    Math.round(x.ecart * (x.ecart<0 ? (x.pv||0)
      : (voitAchats() ? prixAchatDe(boisson(x.boissonId)) : 0)))]));
  const mq = inv.lignes.reduce((s,x)=>s+(x.ecart<0?-x.ecart:0),0);
  const sp = inv.lignes.reduce((s,x)=>s+(x.ecart>0?x.ecart:0),0);
  l.push([], ["Unités manquantes", mq], ["Unités en surplus", sp],
    ["Manque à gagner estimé", inv.lignes.reduce((s,x)=>s+(x.ecart<0?-x.ecart*(x.pv||0):0),0)]);
  telecharger("GEBEN-inventaire-"+inv.date.replace(/-/g,"")+".csv", versCSV(l), "text/csv");
}

function creerSauvegarde(){
  D.derniereSauvegarde = new Date().toISOString();
  journaliser("Sauvegarde créée", "fichier exporté");
  telecharger("GEBEN-sauvegarde-"+suffixe()+".json",
    JSON.stringify({version:2, exporteLe:new Date().toISOString(), donnees:D}, null, 1),
    "application/json");
}
function restaurerSauvegarde(){
  if (!estAdmin()){ signaler("Réservé à l'administrateur"); return; }
  const inp = document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.addEventListener("change", ()=>{
    const f = inp.files && inp.files[0]; if (!f) return;
    const lec = new FileReader();
    lec.onload = async ()=>{
      try{
        const lu = JSON.parse(lec.result);
        const d = lu && lu.donnees ? lu.donnees : lu;
        if (!d || !Array.isArray(d.boissons)) throw new Error("format");
        if (!confirm("Remplacer toutes les données actuelles ?\n\n"+d.boissons.length
          +" boissons, "+((d.saisies||d.journees||[])).length+" saisies de vente.")) return;
        await Depot.ajouterInstantane(D, "avant restauration d'un fichier");
        D = normaliser(d);
        invRefCle=null; invSaisie={}; periode=null;
        /* la sauvegarde contient ses propres comptes et son propre coffre :
           la session en cours n'a plus de sens, on repasse par la connexion */
        session = null; cleCoffre = null; achats = null;
        appliquerTheme();
        fermerFeuille();
        enregistrer();
        if (!D.comptes.length) ecranBienvenue(); else ecranConnexion();
        signaler("Sauvegarde restaurée — reconnectez-vous");
      }catch(e){ signaler("Fichier illisible : choisissez une sauvegarde GEBEN"); }
    };
    lec.readAsText(f);
  });
  inp.click();
}
function effacerTout(){
  if (!estAdmin()){ signaler("Réservé à l'administrateur"); return; }
  if (!confirm("Effacer définitivement toutes les données ?\n\nCréez une sauvegarde avant.")) return;
  if (!confirm("Dernière confirmation : tout effacer ?")) return;
  journaliser("Effacement total", "toutes les données de gestion");
  Depot.ajouterInstantane(D, "avant effacement total");
  const memeComptes = D.comptes, memeCoffre = D.coffre, memJournal = D.journal;
  D = normaliser({ etablissement:D.etablissement, theme:D.theme, dateDepart:aujourdhui() });
  /* les comptes, le coffre et le journal survivent : effacer la gestion ne doit
     pas faire disparaître les traces ni obliger à tout reconfigurer */
  D.comptes = memeComptes; D.coffre = memeCoffre; D.journal = memJournal;
  achats = {}; if (cleCoffre) ecrireCoffre();
  invSaisie={}; saisieVentes={}; invRefCle=null; periode=null;
  enregistrer(); fermerFeuille(); rafraichir();
  signaler("Toutes les données de gestion ont été effacées");
}

/* =====================================================================
   SYNCHRONISATION
   Chaque enregistrement part chiffré vers une table distante. Le serveur ne
   voit que des blocs opaques : ni les ventes, ni les prix, ni les noms. La
   phrase de chiffrement ne quitte jamais les téléphones.
   ===================================================================== */
const CLE_SYNC = "geben_sync";

const Synchro = {
  cfg: null, cle: null, enCours: false, minuteur: null, dernier: null,

  async charger(){
    this.cfg = await Depot.lire(CLE_SYNC);
    if (!this.cfg) this.cfg = { url:"", cle:"", table:"geben_sync", bar:"", phrase:"",
                                auto:true, filigrane:"", envoyes:{} };
    if (!this.cfg.envoyes) this.cfg.envoyes = {};
    return this.cfg;
  },
  async sauver(){ this.cle = null; await Depot.ecrire(CLE_SYNC, this.cfg); },
  active(){ const c = this.cfg; return !!(c && c.url && c.cle && c.bar && c.phrase); },

  async cleRangee(){
    if (this.cle) return this.cle;
    /* sel déterministe tiré de l'identifiant du bar : deux téléphones avec la
       même phrase obtiennent la même clé, sans rien s'échanger */
    const g = new Uint8Array(await sc().digest("SHA-256",
      new TextEncoder().encode(this.cfg.bar)));
    this.cle = await cleDepuis(this.cfg.phrase, enB64(g.slice(0,16)));
    return this.cle;
  },
  adresse(q){
    return this.cfg.url.replace(/\/+$/,"") + "/rest/v1/"
         + (this.cfg.table || "geben_sync") + (q || "");
  },
  entetes(extra){
    return Object.assign({ apikey:this.cfg.cle, Authorization:"Bearer " + this.cfg.cle,
                           "Content-Type":"application/json" }, extra || {});
  },

  /* Ce téléphone détient-il des données qui ne viennent pas de ce bar ?
     On compare les comptes : un appareil légitimement rattaché partage au moins
     un compte avec le serveur. Un appareil qui a créé son propre bar n'en
     partage aucun — le fusionner écraserait le coffre et les comptes du bar. */
  donneesEtrangeres(distant){
    if (!D.comptes.length) return false;
    const recus = (distant.comptes || []).map(c => c.id);
    if (!recus.length) return false;
    const locaux = new Set(D.comptes.map(c => c.id));
    return !recus.some(idc => locaux.has(idc));
  },

  async tirer(){
    const distant = { boissons:[], receptions:[], saisies:[], inventaires:[],
                      comptes:[], supprimes:[], journal:[] };
    let depuis = this.cfg.filigrane || "1970-01-01T00:00:00Z";
    let filigrane = this.cfg.filigrane || "";
    let lu = 0;

    for (let page = 0; page < 40; page++){
      const q = "?bar_id=eq." + encodeURIComponent(this.cfg.bar)
              + "&updated_at=gt." + encodeURIComponent(depuis)
              + "&select=type,rec_id,maj,iv,charge,updated_at"
              + "&order=updated_at.asc&limit=500";
      const r = await fetch(this.adresse(q), { headers:this.entetes() });
      if (!r.ok) throw new Error("lecture refusée par le serveur (" + r.status + ")");
      const lignes = await r.json();
      if (!lignes.length) break;

      for (const ligne of lignes){
        let objet;
        try{ objet = await this.dechiffrer(ligne); }
        catch(e){ throw new Error("phrase de chiffrement incorrecte"); }
        switch (ligne.type){
          case "boisson":    distant.boissons.push(objet); break;
          case "reception":  distant.receptions.push(objet); break;
          case "saisie":     distant.saisies.push(objet); break;
          case "inventaire": distant.inventaires.push(objet); break;
          case "compte":     distant.comptes.push(objet); break;
          case "supprime":   distant.supprimes.push(objet); break;
          case "journal":    distant.journal.push(objet); break;
          case "reglages":   distant.reglages = Object.assign({ maj:ligne.maj }, objet); break;
          case "coffre":     distant.coffre = { maj:ligne.maj, valeur:objet }; break;
          case "verrou":     distant.verrou = { maj:ligne.maj, valeur:objet }; break;
        }
        if (String(ligne.updated_at) > String(filigrane)) filigrane = ligne.updated_at;
        lu++;
      }
      depuis = lignes[lignes.length - 1].updated_at;
      if (lignes.length < 500) break;
    }
    return { distant, filigrane, lu };
  },

  async chiffrer(objet){
    return await chiffrer(await this.cleRangee(),
      new TextEncoder().encode(JSON.stringify(objet)));
  },
  async dechiffrer(ligne){
    const o = await dechiffrer(await this.cleRangee(), ligne.iv, ligne.charge);
    return JSON.parse(new TextDecoder().decode(o));
  },

  async lignesAEnvoyer(){
    /* On retient ce qui a déjà été envoyé enregistrement par enregistrement.
       Un simple horodatage global ne suffirait pas : le téléphone dont
       l'horloge retarde produirait des dates antérieures au repère, et ses
       modifications ne partiraient jamais. */
    const dejaEnvoye = this.cfg.envoyes || {};
    const lignes = [];
    const marques = [];
    const ajouter = async (type, recId, maj, objet) => {
      const m = String(maj || maintenant());
      const k = type + "/" + recId;
      if (dejaEnvoye[k] === m) return;
      const c = await this.chiffrer(objet);
      lignes.push({ bar_id:this.cfg.bar, type, rec_id:recId, maj:m,
                    iv:c.iv, charge:c.donnees });
      marques.push([k, m]);
    };
    for (const { cle, type } of COLLECTIONS)
      for (const o of D[cle]) await ajouter(type, o.id, o.maj, o);
    for (const t of D.supprimes) await ajouter("supprime", t.type + "/" + t.id, t.le, t);
    for (const e of (D.journal || [])) await ajouter("journal", e.id || e.le, e.le, e);
    await ajouter("reglages", "reglages", D.meta.reglages, {
      etablissement: D.etablissement, theme: D.theme,
      dateDepart: D.dateDepart, derniereSauvegarde: D.derniereSauvegarde });
    if (D.coffre) await ajouter("coffre", "coffre", D.meta.coffre, D.coffre);
    if (D.verrou) await ajouter("verrou", "verrou", D.meta.verrou, D.verrou);
    return { lignes, marques };
  },

  async pousser(){
    const { lignes, marques } = await this.lignesAEnvoyer();
    for (let i = 0; i < lignes.length; i += 100){
      const lot = lignes.slice(i, i + 100);
      const r = await fetch(this.adresse(), {
        method: "POST",
        headers: this.entetes({ Prefer: "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify(lot)
      });
      if (!r.ok) throw new Error("écriture refusée par le serveur (" + r.status + ")");
      /* on ne marque que ce qui est réellement parti : un échec au milieu
         laisse le reste à renvoyer au prochain passage */
      for (let j = i; j < i + lot.length; j++)
        this.cfg.envoyes[marques[j][0]] = marques[j][1];
    }
    return { envoyees: lignes.length };
  },

  async synchroniser(discret){
    if (estDetache()){
      if (!discret) signaler("Téléphone détaché : rattachez-le au bar d'abord");
      return null;
    }
    if (!this.active()){ if (!discret) signaler("Synchronisation non configurée"); return null; }
    if (this.enCours) return null;
    if (typeof fetch !== "function"){ if (!discret) signaler("Ce navigateur ne peut pas contacter le serveur"); return null; }
    if (navigator && navigator.onLine === false){
      if (!discret) signaler("Pas de connexion — la synchronisation attendra");
      return null;
    }
    this.enCours = true;
    try{
      const premierContact = !this.cfg.filigrane;
      const recu = await this.tirer();

      if (premierContact && this.donneesEtrangeres(recu.distant)){
        /* On s'arrête AVANT la fusion et AVANT tout envoi : rien n'est ni lu
           ni écrit de travers. Le seul chemin correct est le rattachement,
           qui remplace le contenu local par celui du bar. */
        this.cfg.etranger = true;
        await this.sauver();
        this.dernier = { le: maintenant(),
          erreur: "ce téléphone contient un autre bar : il doit être rattaché" };
        if (!discret) proposerRattachement();
        return this.dernier;
      }
      if (this.cfg.etranger){ this.cfg.etranger = false; }

      const bilan = fusionner(recu.distant);
      if (bilan.coffreRemplace) await verifierCoffreApresFusion();
      /* Supprimer un compte ne sert à rien si l'appareil concerné reste ouvert :
         on ferme la session dès que le compte a disparu ou été désactivé. */
      if (!monCompteEstValide()){
        this.cfg.filigrane = recu.filigrane || this.cfg.filigrane;
        await this.sauver();
        await Depot.ecrire(CLE, D);
        this.dernier = { le: maintenant(), recu: recu.lu, envoye: 0,
                         ajoutes: bilan.ajoutes, remplaces: bilan.remplaces, erreur: null };
        signaler("Votre compte n'est plus actif : reconnectez-vous");
        deconnexion();
        return this.dernier;
      }
      /* on oublie le repère d'envoi de ces enregistrements pour les réexpédier */
      bilan.aRenvoyer.forEach(k => { delete this.cfg.envoyes[k]; });
      const envoi = await this.pousser();

      this.cfg.filigrane = recu.filigrane || this.cfg.filigrane;
      await this.sauver();
      await Depot.ecrire(CLE, D);

      this.dernier = { le: maintenant(), recu: recu.lu, envoye: envoi.envoyees,
                       ajoutes: bilan.ajoutes, remplaces: bilan.remplaces, erreur: null };
      /* Un compte tout juste créé par l'administrateur doit apparaître ici :
         si l'écran de connexion est affiché, on le redessine. */
      if (!session && document.getElementById("cxMdp")) ecranConnexion();
      else if (vueActive && session) rafraichir();
      if (!discret)
        signaler(recu.lu || envoi.envoyees
          ? "Synchronisé · " + recu.lu + " reçus, " + envoi.envoyees + " envoyés"
          : "Déjà à jour");
      return this.dernier;
    }catch(e){
      this.dernier = { le: maintenant(), erreur: e.message || "échec" };
      if (!discret) signaler("Synchronisation : " + this.dernier.erreur);
      return this.dernier;
    }finally{
      this.enCours = false;
    }
  }
};

/* Dépose une seule entrée de journal sur le serveur, sans rien synchroniser
   d'autre. Sert à signaler une opération grave faite sur cet appareil. */
async function tracerAuServeur(entree){
  if (!entree || !Synchro.active() || typeof fetch !== "function") return false;
  try{
    const c = await Synchro.chiffrer(entree);
    const r = await fetch(Synchro.adresse(), {
      method: "POST",
      headers: Synchro.entetes({ Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ bar_id:Synchro.cfg.bar, type:"journal",
        rec_id: entree.id, maj: entree.le, iv:c.iv, charge:c.donnees }])
    });
    return r.ok;
  }catch(e){ return false; }
}

/* Coupe tout envoi depuis cet appareil. */
async function detacherDuServeur(){
  clearTimeout(Synchro.minuteur);
  Synchro.cfg = { url:"", cle:"", table:"geben_sync", bar:"", phrase:"",
                  auto:true, filigrane:"", envoyes:{} };
  Synchro.cle = null;
  await Synchro.sauver();
}

/* déclenchement discret : après une salve d'écritures, et au retour à l'écran */
function planifierSynchro(){
  if (!Synchro.cfg || !Synchro.cfg.auto || !Synchro.active()) return;
  if (Synchro.cfg.etranger) return;   /* en attente de rattachement */
  clearTimeout(Synchro.minuteur);
  Synchro.minuteur = setTimeout(()=> Synchro.synchroniser(true), 15000);
}
document.addEventListener("visibilitychange", ()=>{
  if (!document.hidden && session && Synchro.cfg && Synchro.cfg.auto) Synchro.synchroniser(true);
});

function formulaireCompte(cid){
  const c = cid ? compteDe(cid) : null;
  const moi = c && session && c.id === session.id;

  ouvrirFeuille(
    "<h2>" + (c ? ech(c.nom) : "Nouveau compte utilisateur") + "</h2>"
    + (c
        ? '<p class="aide">' + (c.role==="admin" ? "Administrateur" : "Utilisateur")
          + ' · créé le ' + horodatage(c.creeLe)
          + ' · ' + nombre(c.nbConnexions||0) + ' connexion(s)'
          + ' · dernière le ' + horodatage(c.derniereConnexion) + '</p>'
        : '<p class="aide">Un utilisateur voit le stock, les ventes, les inventaires et les '
          + 'rapports, mais ni les prix d\'achat ni les marges. Il ne peut pas valider un rapport '
          + 'ni modifier une période clôturée.</p>')
    + '<label><span class="lib">Nom</span><input id="kNom" value="'+(c?ech(c.nom):"")+'" '
    + 'autocomplete="off" maxlength="30" placeholder="Prénom du serveur"></label>'
    + '<label style="margin-top:11px"><span class="lib">'
    + (c ? "Nouveau mot de passe (laisser vide pour ne pas changer)" : "Mot de passe")
    + '</span><input id="kMdp" type="password" autocomplete="new-password"></label>'
    + (c && c.role === "admin" && !moi ? "" : "")
    + '<button class="btn" id="kOk" style="margin-top:12px">'
    + (c ? "Enregistrer" : "Créer le compte") + '</button>'
    + (c && c.role !== "admin"
        ? '<button class="btn btn-fant" id="kActif">'
          + (c.actif===false ? "Réactiver ce compte" : "Désactiver ce compte") + '</button>'
          + '<button class="btn btn-danger" id="kDel">Supprimer ce compte</button>'
        : '')
    + '<button class="btn btn-fant" id="kNon">Annuler</button>',
  ()=>{
    document.getElementById("kNon").addEventListener("click", fermerFeuille);

    document.getElementById("kOk").addEventListener("click", async ()=>{
      const nom = document.getElementById("kNom").value.trim();
      const mdp = document.getElementById("kMdp").value;
      if (!nom){ signaler("Indiquez un nom"); return; }
      if (D.comptes.some(x => x.nom.toLowerCase()===nom.toLowerCase() && (!c || x.id!==c.id))){
        signaler("Ce nom est déjà utilisé"); return;
      }
      const bouton = document.getElementById("kOk");
      bouton.setAttribute("disabled",""); bouton.textContent = "Enregistrement…";
      try{
        if (!c){
          if (mdp.length < 4){ throw new Error("court"); }
          D.comptes.push(await nouveauCompte(nom, mdp, "agent"));
          journaliser("Compte créé", nom);
          signaler(nom + " peut maintenant se connecter");
        } else {
          const ancien = c.nom;
          c.nom = nom;
          if (mdp){
            if (mdp.length < 4){ throw new Error("court"); }
            c.sel = enB64(alea(16));
            c.empreinte = await empreinteDe(mdp, c.sel);
            /* l'administrateur chiffre le coffre : changer son mot de passe
               oblige à réenfermer la clé, sinon les prix deviendraient illisibles */
            if (c.role === "admin"){
              if (!cleCoffre){ throw new Error("coffre"); }
              await reenfermerCoffre(mdp);
            }
            journaliser("Mot de passe réinitialisé", nom);
          }
          if (ancien !== nom) journaliser("Compte renommé", ancien + " → " + nom);
          if (session && c.id === session.id) session.nom = nom;
          signaler("Compte enregistré");
        }
        enregistrer(); fermerFeuille(); majEntete(); rendreAdmin();
      }catch(e){
        bouton.removeAttribute("disabled");
        bouton.textContent = c ? "Enregistrer" : "Créer le compte";
        if (e.message === "court") signaler("Quatre caractères au minimum");
        else if (e.message === "coffre") signaler("Reconnectez-vous avant de changer ce mot de passe");
        else signaler("Échec de l'enregistrement");
      }
    });

    const ba = document.getElementById("kActif");
    if (ba) ba.addEventListener("click", ()=>{
      c.actif = (c.actif === false);
      journaliser(c.actif ? "Compte réactivé" : "Compte désactivé", c.nom);
      enregistrer(); fermerFeuille(); rendreAdmin();
      signaler(c.actif ? c.nom + " réactivé" : c.nom + " désactivé");
    });

    const bd = document.getElementById("kDel");
    if (bd) bd.addEventListener("click", ()=>{
      if (!confirm("Supprimer le compte de " + c.nom + " ?\n\nLe journal garde la trace de "
        + "ses connexions et de ses saisies.")) return;
      marquerSupprime("compte", c.id);
      D.comptes = D.comptes.filter(x => x.id !== c.id);
      journaliser("Compte supprimé", c.nom);
      enregistrer(); fermerFeuille(); rendreAdmin();
      signaler(c.nom + " supprimé");
    });
  });
}

        "bar-" + enB64(alea(12)).replace(/[^A-Za-z0-9]/g,"").slice(0,16).toLowerCase();
    });
    async function relever(){
      Synchro.cfg.url = document.getElementById("syUrl").value.trim();
      Synchro.cfg.cle = document.getElementById("syCle").value.trim();
      Synchro.cfg.bar = document.getElementById("syBar").value.trim();
      Synchro.cfg.phrase = document.getElementById("syPhrase").value;
      Synchro.cfg.auto = document.getElementById("syAuto").checked;
      await Synchro.sauver();
      if (Synchro.active()) noterRattachement(Synchro.cfg);
    }
    document.getElementById("sySync").addEventListener("click", async ()=>{
      await relever();
      if (!Synchro.active()){ signaler("Remplissez les quatre champs"); return; }
      const b = document.getElementById("sySync");
      b.setAttribute("disabled",""); b.textContent = "Synchronisation…";
      const r = await Synchro.synchroniser(false);
      if (r && !r.erreur) journaliser("Synchronisation",
        r.recu + " reçus, " + r.envoye + " envoyés");
      ouvrirSynchro();
    });
    document.getElementById("syTout").addEventListener("click", async ()=>{
      await relever();
      if (!Synchro.active()){ signaler("Remplissez les quatre champs"); return; }
      if (!confirm("Tout retélécharger ?\n\nRien n'est effacé : les enregistrements du "
        + "serveur seront réunis avec ceux du téléphone.")) return;
      Synchro.cfg.filigrane = ""; Synchro.cfg.envoyes = {};
      await Synchro.sauver();
      await Synchro.synchroniser(false);
      ouvrirSynchro();
    });
    document.getElementById("syStop").addEventListener("click", async ()=>{
      if (!confirm("Arrêter la synchronisation de ce téléphone ?\n\nLes données restent "
        + "en place, ici comme sur le serveur.")) return;
      Synchro.cfg = { url:"", cle:"", table:"geben_sync", bar:"", phrase:"",
                      auto:true, filigrane:"", envoyes:{} };
      await Synchro.sauver();
      journaliser("Synchronisation arrêtée", "sur cet appareil");
      fermerFeuille(); signaler("Synchronisation arrêtée");
    });
    document.getElementById("syFin").addEventListener("click", fermerFeuille);
  });
}

async function ouvrirInstantanes(){
  if (!estAdmin()){ signaler("Réservé à l'administrateur"); return; }
  ouvrirFeuille(
    "<h2>Historique local</h2>"
    + '<p class="aide">L\'application garde une copie de vos données à chaque journée '
    + 'd\'utilisation, ainsi qu\'avant toute opération risquée. Vous pouvez revenir à '
    + 'l\'une de ces copies. Elles sont dans le téléphone : elles ne remplacent pas une '
    + 'sauvegarde envoyée ailleurs.</p>'
    + '<div id="inListe"><p class="aide">Lecture de la base…</p></div>'
    + '<button class="btn btn-fant" id="inNouveau">Créer une copie maintenant</button>'
    + '<button class="btn btn-fant" id="inFin">Fermer</button>');

  const liste = await Depot.instantanes();

    ? '<div class="liste" style="margin:0 calc(var(--pad) * -1) 14px">'
      + liste.map(i =>
          '<div class="ligne"><button class="corps" data-inst="'+i.id+'" style="text-align:left">'

          + '<button class="sup" data-supinst="'+i.id+'" aria-label="Supprimer cette copie">&times;</button>'
          + '</div>').join("")
      + '</div>'
    : '<p class="aide">Aucune copie pour l\'instant. La première sera créée automatiquement '
      + 'à la prochaine écriture.</p>';

  zone.querySelectorAll("[data-inst]").forEach(el =>
    el.addEventListener("click", ()=> {
      const i = liste.find(x => String(x.id) === el.dataset.inst);
      if (i) restaurerInstantane(i.id, horodatage(i.le));
    }));
  zone.querySelectorAll("[data-supinst]").forEach(el =>
    el.addEventListener("click", async ()=>{
      if (!confirm("Supprimer cette copie ?")) return;
      await Depot.supprimerInstantane(Number(el.dataset.supinst));
      ouvrirInstantanes();
    }));
  document.getElementById("inNouveau").addEventListener("click", async ()=>{
    const ok = await Depot.ajouterInstantane(D, "copie manuelle");
    signaler(ok ? "Copie enregistrée" : "Copie impossible");
    if (ok) ouvrirInstantanes();
  });

async function restaurerInstantane(idInstantane, quand){
  if (!estAdmin()){ signaler("Réservé à l'administrateur"); return; }
  if (!confirm("Revenir à la copie du " + quand + " ?\n\n"
    + "Les saisies faites depuis seront perdues : boissons, entrées, ventes et "
    + "inventaires reviendront à leur état de ce moment.\n\n"
    + "Les comptes, les mots de passe et les prix d'achat ne sont pas touchés. "
    + "L'état actuel est mis de côté juste avant, vous pourrez donc revenir.")) return;

  await Depot.ajouterInstantane(D, "avant retour en arrière");
  const copie = await Depot.lireInstantane(idInstantane);
  if (!copie){ signaler("Copie illisible"); return; }

  /* Un retour en arrière porte sur les données de gestion, jamais sur les
     identifiants : ramener des comptes anciens déconnecterait l'utilisateur, et
     ramener un ancien coffre rendrait les prix d'achat illisibles. */
  const comptes = D.comptes, coffre = D.coffre, journal = D.journal;
  const etablissement = D.etablissement, theme = D.theme;
  const derniereSauvegarde = D.derniereSauvegarde;

  D = normaliser(copie);
  D.comptes = comptes; D.coffre = coffre; D.journal = journal;
  D.etablissement = etablissement; D.theme = theme;
  D.derniereSauvegarde = derniereSauvegarde;

  invRefCle = null; invSaisie = {}; periode = null;
  chargerJournee(dateVentes);
  journaliser("Retour à une copie locale", quand);
  await Depot.ecrire(CLE, D);
  fermerFeuille(); rafraichir();
  signaler("Données revenues au " + quand);
}

/* ---------- mémoire locale du dernier rattachement ----------
   Ni l'adresse du serveur, ni la clé, ni l'identifiant du bar ne figurent dans
   les fichiers publiés : ils ne vivent que dans les téléphones. Ce petit
   souvenir sert uniquement à pré-remplir l'écran de rattachement. */
function noterRattachement(c){
  try{ localStorage.setItem("geben_dernier_bar",
    JSON.stringify({ url:c.url, cle:c.cle, bar:c.bar })); }catch(e){}
}
function dernierRattachement(){
  try{ return JSON.parse(localStorage.getItem("geben_dernier_bar") || "null"); }
  catch(e){ return null; }
}
/* Un téléphone passé par le dernier recours est « détaché » : il ne peut plus
   rien envoyer au serveur. Sans cela, un utilisateur pourrait effacer les
   comptes et les prix de son appareil, puis propager cette destruction à tous
   les autres téléphones. */
function estDetache(){
  try{ return localStorage.getItem("geben_detache") === "1"; }catch(e){ return false; }
}
function marquerDetache(oui){
  try{
    if (oui) localStorage.setItem("geben_detache", "1");
    else localStorage.removeItem("geben_detache");
  }catch(e){}
}

/* ---------- autorisation de créer un bar ----------
   Sans ce verrou, n'importe qui recevant le lien pouvait se fabriquer une
   application séparée avec son propre administrateur. Le code est détenu par
   l'administrateur principal, qui le donne à qui installe un nouveau bar. */
function ecranCodeCreation(){
  afficherAcces(
    LOGO
    + "<h2>Accord de l'administrateur</h2>"
    + '<p class="sous">Créer un bar demande le code de création, détenu par '
    + 'l\'administrateur principal de l\'établissement.</p>'
    + '<label><span class="lib">Code de création</span>'
    + '<input id="ccCode" autocomplete="off" spellcheck="false" '
    + 'placeholder="XXXXX-XXXXX-XXXXX"></label>'
    + '<p class="aide">Si vous venez rejoindre un bar déjà en service, vous n\'avez pas '
    + 'besoin de ce code : revenez en arrière et choisissez « Rejoindre un bar déjà en '
    + 'service ».</p>'
    + '<button class="btn" id="ccOk" style="margin-top:6px">Continuer</button>'
    + '<button class="lien" id="ccRetour">Retour</button>',
  ()=>{
    document.getElementById("ccRetour").addEventListener("click", ecranBienvenue);
    const champ = document.getElementById("ccCode");
    const bouton = document.getElementById("ccOk");
    let essais = 0;
    async function verifier(){
      const code = champ.value;
      if (normaliserCode(code).length < 8){ signaler("Code incomplet"); return; }
      bouton.setAttribute("disabled",""); bouton.textContent = "Vérification…";
      const bon = await codeCreationValide(code);
      bouton.removeAttribute("disabled"); bouton.textContent = "Continuer";
      if (bon){ ecranConfiguration(); return; }
      essais++;
      champ.value = "";
      signaler("Code de création incorrect");
      if (essais >= 3){
        /* attente croissante : décourage les essais en série */
        const attente = Math.min(30, (essais - 2) * 10);
        let reste = attente;
        bouton.setAttribute("disabled","");
        bouton.textContent = "Patientez " + reste + " s";
        const t = setInterval(()=>{
          reste--;
          if (reste <= 0){ clearInterval(t); bouton.removeAttribute("disabled");
                           bouton.textContent = "Continuer"; }
          else bouton.textContent = "Patientez " + reste + " s";
        }, 1000);
      }
    }
    bouton.addEventListener("click", verifier);
    champ.addEventListener("keydown", e => { if (e.key === "Enter") verifier(); });
    setTimeout(()=>champ.focus(), 60);
  });
}

      const phrase = document.getElementById("rjPhrase").value;

      Synchro.cfg = { url, cle, bar, phrase, table:"geben_sync",

      Synchro.cle = null;
      try{
        const recu = await Synchro.tirer();
