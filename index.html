function imprimerInventaire(inv){
  const mq = inv.lignes.reduce((s,x)=>s+(x.ecart<0?-x.ecart:0),0);
  const sp = inv.lignes.reduce((s,x)=>s+(x.ecart>0?x.ecart:0),0);
  const val = inv.lignes.reduce((s,x)=>s+(x.ecart<0?-x.ecart*(x.pv||0):0),0);
  document.getElementById("impression").innerHTML =
    enteteImpression("Inventaire du "+dateLongue(inv.date))
    + "<h2>Résumé</h2>"
    + '<div class="res"><div>Boissons comptées<b>'+inv.lignes.length+'</b></div>'
    + '<div>Écarts<b>'+inv.lignes.filter(l=>l.ecart!==0).length+'</b></div>'
    + '<div>Unités manquantes<b>'+nombre(mq)+'</b></div>'
    + '<div>Unités en surplus<b>'+nombre(sp)+'</b></div>'
    + '<div>Manque à gagner<b>'+argent(val)+'</b></div></div>'
    + "<p>Point de départ : "+ech(inv.refLibelle||"origine")
    + ". Théorique = stock de référence + entrées de la période − ventes de la période.</p>"
    + "<h2>Détail par boisson</h2>"
    + "<table><thead><tr><th>Boisson</th><th>Référence</th><th>Entrées</th><th>Ventes</th>"
    + "<th>Théorique</th><th>Réel</th><th>Écart</th></tr></thead><tbody>"
    + inv.lignes.map(l=>"<tr><td>"+ech(l.nom)+"</td><td>"+nombre(l.base)+"</td><td>"+nombre(l.entrees)
      + "</td><td>"+nombre(l.ventes)+"</td><td>"+nombre(l.theorique)+"</td><td>"+nombre(l.reel)
      + "</td><td>"+(l.ecart>0?"+":"")+nombre(l.ecart)+"</td></tr>").join("")
    + "</tbody></table>"
    + '<div class="pied">Document édité par l\'application de gestion de stock de '
    + ech(D.etablissement) + '.</div>';
  setTimeout(()=>window.print(), 120);
}

/* =====================================================================
   SAUVEGARDE
   ===================================================================== */
function creerSauvegarde(){
  telecharger("GEBEN-sauvegarde-"+suffixe()+".json",
    JSON.stringify({version:2, exporteLe:new Date().toISOString(), donnees:D}, null, 1),
    "application/json");
}
function restaurerSauvegarde(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.addEventListener("change", ()=>{
    const f = inp.files && inp.files[0]; if (!f) return;
    const lec = new FileReader();
    lec.onload = ()=>{
      try{
        const lu = JSON.parse(lec.result);
        const d = lu && lu.donnees ? lu.donnees : lu;
        if (!d || !Array.isArray(d.boissons)) throw new Error("format");
        if (!confirm("Remplacer toutes les données actuelles ?\n\n"+d.boissons.length
          +" boissons, "+(d.journees||[]).length+" journées de vente.")) return;
        D = normaliser(d);
        invRefCle=null; invSaisie={}; periode=null;
        appliquerTheme(); chargerJournee(dateVentes);
        enregistrer(); rafraichir(); signaler("Sauvegarde restaurée");
      }catch(e){ signaler("Fichier illisible : choisissez une sauvegarde GEBEN"); }
    };
    lec.readAsText(f);
  });
  inp.click();
}
function effacerTout(){
  if (!confirm("Effacer définitivement toutes les données ?\n\nCréez une sauvegarde avant.")) return;
  if (!confirm("Dernière confirmation : tout effacer ?")) return;
  D = normaliser({ etablissement:D.etablissement, theme:D.theme, dateDepart:aujourdhui() });
  invSaisie={}; saisieVentes={}; invRefCle=null; periode=null;
  enregistrer(); rafraichir(); signaler("Toutes les données ont été effacées");
}

/* =====================================================================
   INSTALLATION SUR L'APPAREIL
   Chrome ne propose l'installation que si la page est servie en HTTPS, avec
   un manifeste et un service worker enregistré. Ouvert directement depuis le
   gestionnaire de fichiers (protocole file:), tout fonctionne sauf
   l'installation : le code ci-dessous se contente alors de se taire.
   ===================================================================== */
let invitationInstall = null;

function estInstallee(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || window.navigator.standalone === true;
  }catch(e){ return false; }
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  invitationInstall = e;
  if (vueActive === "boissons") rendreBoissons();
});

window.addEventListener("appinstalled", ()=>{
  invitationInstall = null;
  signaler("Application installée sur l'écran d'accueil");
  if (vueActive === "boissons") rendreBoissons();
});

async function lancerInstallation(){
  if (!invitationInstall){
    signaler("Utilisez le menu du navigateur, « Installer l'application »");
    return;
  }
  const invitation = invitationInstall;
  invitationInstall = null;
  try{
    invitation.prompt();
    const choix = await invitation.userChoice;
    if (choix && choix.outcome === "dismissed") invitationInstall = invitation;
  }catch(e){ signaler("Installation impossible depuis ce navigateur"); }
  if (vueActive === "boissons") rendreBoissons();
}

/* mise en cache de l'application pour un fonctionnement sans réseau */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

/* =====================================================================
   RÉGLAGES
   ===================================================================== */
function nuancier(liste, courant, attribut){
  return '<div class="chips">' + liste.map(c=>
    '<button class="chip" '+attribut+'="'+c.val+'" title="'+c.nom+'" aria-label="'+c.nom+'" '
    + 'aria-pressed="'+(c.val.toLowerCase()===String(courant).toLowerCase())+'">'
    + '<span style="background:'+c.val+'"></span></button>').join("") + '</div>';
}

function ouvrirReglages(){
  const t = D.theme || THEME_DEFAUT;
  ouvrirFeuille(
    "<h2>Réglages</h2>"
    + '<label><span class="lib">Nom de l\'établissement</span>'
    + '<input id="gEtab" value="'+ech(D.etablissement)+'" maxlength="40" autocomplete="off"></label>'
    + '<p class="aide">Ce nom apparaît en haut de l\'écran et sur tous les rapports imprimés.</p>'

    + '<hr class="rgl-sep"><p class="rgl-t">Couleur de fond</p>'
    + nuancier(FONDS, t.fond, "data-fond")
    + '<label style="margin-top:10px"><span class="lib">Ou une couleur libre</span>'
    + '<input type="color" id="gFond" value="'+t.fond+'"></label>'
    + '<p class="aide">Les surfaces, les filets et le texte sont recalculés automatiquement '
    + 'à partir du fond choisi, pour rester lisibles sur clair comme sur sombre.</p>'

    + '<p class="rgl-t">Couleur d\'accent</p>'
    + nuancier(ACCENTS, t.accent, "data-accent")
    + '<label style="margin-top:10px"><span class="lib">Ou une couleur libre</span>'
    + '<input type="color" id="gAccent" value="'+t.accent+'"></label>'
    + '<p class="aide">L\'accent sert aux montants, aux boutons et à l\'onglet actif.</p>'
    + '<button class="btn btn-fant" id="gReset">Revenir au thème d\'origine</button>'

    + '<hr class="rgl-sep"><p class="rgl-t">Installation</p>'
    + (estInstallee()
        ? '<p class="aide" style="margin-top:0">L\'application est installée sur cet appareil. '
          + 'Elle fonctionne sans connexion internet.</p>'
        : invitationInstall
          ? '<p class="aide" style="margin-top:0">Ajoutez l\'application à l\'écran d\'accueil '
            + 'pour l\'ouvrir directement, avec son icône, sans barre de navigateur.</p>'
            + '<button class="btn" id="gInstall">Installer sur l\'écran d\'accueil</button>'
          : '<p class="aide" style="margin-top:0">Pour installer : menu du navigateur, puis '
            + '« Installer l\'application » ou « Ajouter à l\'écran d\'accueil ». Si l\'option '
            + 'n\'apparaît pas, c\'est que la page n\'est pas ouverte depuis une adresse en https.</p>')

    + '<hr class="rgl-sep"><p class="rgl-t">Sauvegarde des données</p>'
    + '<p class="aide" style="margin-top:0">Les données sont uniquement sur ce téléphone. '
    + 'Créez une sauvegarde chaque semaine et envoyez-la sur WhatsApp.</p>'
    + '<button class="btn btn-fant" id="gOut">Créer une sauvegarde</button>'
    + '<button class="btn btn-fant" id="gIn">Restaurer une sauvegarde</button>'
    + '<button class="btn btn-danger" id="gRaz">Effacer toutes les données</button>'
    + '<p class="aide" style="margin:12px 0 0">'+D.boissons.length+' boissons · '
    + D.receptions.length+' réceptions · '+D.journees.length+' journées de vente · '
    + D.inventaires.length+' inventaires · mise en service le '+dateCourte(D.dateDepart)+'</p>'
    + '<button class="btn btn-fant" id="gFin" style="margin-top:14px">Fermer</button>',
  ()=>{
    /* cle : "fond" ou "accent" ; attribut : "data-fond" ou "data-accent" */
    function poser(cle, attribut, val){
      D.theme = Object.assign({}, D.theme || THEME_DEFAUT);
      D.theme[cle] = val;
      appliquerTheme(); enregistrer();
      fContenu.querySelectorAll("["+attribut+"]").forEach(c=>
        c.setAttribute("aria-pressed",
          c.getAttribute(attribut).toLowerCase() === val.toLowerCase() ? "true" : "false"));
    }
    fContenu.querySelectorAll("[data-fond]").forEach(c=>
      c.addEventListener("click", ()=>{
        const v = c.dataset.fond;
        poser("fond", "data-fond", v);
        document.getElementById("gFond").value = v;
      }));
    fContenu.querySelectorAll("[data-accent]").forEach(c=>
      c.addEventListener("click", ()=>{
        const v = c.dataset.accent;
        poser("accent", "data-accent", v);
        document.getElementById("gAccent").value = v;
      }));
    document.getElementById("gFond").addEventListener("input", e=>
      poser("fond", "data-fond", e.target.value));
    document.getElementById("gAccent").addEventListener("input", e=>
      poser("accent", "data-accent", e.target.value));
    document.getElementById("gReset").addEventListener("click", ()=>{
      D.theme = Object.assign({}, THEME_DEFAUT);
      appliquerTheme(); enregistrer(); ouvrirReglages(); signaler("Thème d'origine rétabli");
    });

    document.getElementById("gEtab").addEventListener("change", e=>{
      D.etablissement = e.target.value.trim() || "BAR RESTO GEBEN";
      enregistrer(); majEntete();
    });

    const gi = document.getElementById("gInstall");
    if (gi) gi.addEventListener("click", async ()=>{ await lancerInstallation(); fermerFeuille(); });
    document.getElementById("gOut").addEventListener("click", creerSauvegarde);
    document.getElementById("gIn").addEventListener("click", restaurerSauvegarde);
    document.getElementById("gRaz").addEventListener("click", effacerTout);
    document.getElementById("gFin").addEventListener("click", fermerFeuille);
  });
}
document.getElementById("btnReglages").addEventListener("click", ouvrirReglages);

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
const CATALOGUE_GEBEN = [
"FLAG GM","LB GM","LB PM","BEAUFORT GM","BEAUFORT PM","CASTEL GM","CHILL GM","CHILL PM",
"COCA GM","COCA PM","COCA PET","COCKTAIL GM","COCKTAIL PM","COCKTAIL PET","DOPPEL GM",
"DOPPEL PM","EKU PM","GUINNESS PM","HAGBE","KANKPE","AWOYO BENIN","AWOYO TOGO","VALMONT",
"MALTA ENER","MALTA CAFE","MALTA CANET","MOKA GM","MOKA PM","PAMPL GM","PAMPL PM","PAMPL PET",
"PILS GM","YOUZOU GM","YOUZOU PM","SPRIT PET","TEQUILA BOOSTER","BULDOZER","XXL PM","LEGEND",
"DESPERADO","ENERGY DRINK","HEINEKEN","JUS IRA","VODY","CONTESSE","AQUA BELLE","FIFA","KWABO",
"POSSOCITRON","POSSOTOMEY","CASSERA","GEZEFIE"
];

function normaliser(d){
  const n = {
    etablissement: (d.etablissement || "BAR RESTO GEBEN").slice(0,40),
    theme: {
      fond: (d.theme && d.theme.fond) || THEME_DEFAUT.fond,
      accent: (d.theme && d.theme.accent) || THEME_DEFAUT.accent
    },
    dateDepart: d.dateDepart || aujourdhui(),
    boissons: (d.boissons||[]).map(b=>({
      id: b.id || ("b"+Math.random().toString(36).slice(2,9)),
      nom: b.nom || "",
      marque: b.marque || "", format: b.format || "",
      prixAchat: Math.max(0, Math.round(+b.prixAchat||0)),
      prixVente: Math.max(0, Math.round(+b.prixVente||0)),
      stockInitial: Math.max(0, Math.round(+(b.stockInitial!=null?b.stockInitial:b.stock)||0)),
      seuil: Math.max(0, Math.round(+b.seuil||0))
    })),
    receptions: d.receptions || [],
    journees: d.journees || [],
    inventaires: d.inventaires || [],
    comptage: d.comptage || null,
    compteur: d.compteur || 1
  };
  n.journees.sort((a,b)=>a.date.localeCompare(b.date));
  n.inventaires.sort((a,b)=>a.date.localeCompare(b.date));
  return n;
}

/* Reprise des données de la version 1 : les entrées deviennent des
   réceptions groupées par date et fournisseur, les ventes des journées. */
function migrerV1(v1){
  const recs = new Map();
  (v1.entrees||[]).forEach(e=>{
    const cle = e.date + "|" + (e.fournisseur||"");
    if (!recs.has(cle)) recs.set(cle, {id:"r"+recs.size, date:e.date, fournisseur:e.fournisseur||"", lignes:[]});
    recs.get(cle).lignes.push({boissonId:e.boissonId, nom:e.nomBoisson||"", qte:e.qte, pa:e.prixAchat||0});
  });
  const jours = new Map();
  (v1.ventes||[]).forEach(v=>{
    if (!jours.has(v.date)) jours.set(v.date, {date:v.date, lignes:[]});
    const j = jours.get(v.date);
    const dejà = j.lignes.find(l=>l.boissonId===v.boissonId && l.pu===v.pu);
    if (dejà) dejà.qte += v.qte;
    else j.lignes.push({boissonId:v.boissonId, nom:v.nomBoisson||"", qte:v.qte, pu:v.pu, pa:v.prixAchat||0});
  });
  return normaliser({
    dateDepart: v1.dateDepart || null,
    boissons: v1.boissons,
    receptions: [...recs.values()],
    journees: [...jours.values()],
    inventaires: (v1.inventaires||[]).map(inv=>({
      id: inv.id, date: inv.date, refLibelle: "origine",
      lignes: (inv.lignes||[]).map(l=>({
        boissonId:l.boissonId, nom:l.nom, base:l.theorique, baseDate:inv.date,
        entrees:0, ventes:0, theorique:l.theorique, reel:l.reel, ecart:l.ecart,
        pa:l.prixAchat||0, pv:0
      }))
    })),
    compteur: v1.compteur || 1
  });
}

async function demarrer(){
  const sauve = await Depot.lire(CLE);
  if (sauve && Array.isArray(sauve.boissons) && sauve.boissons.length){
    D = normaliser(sauve);
  } else {
    const v1 = await Depot.lire(CLE_V1);
    if (v1 && Array.isArray(v1.boissons) && v1.boissons.length
        && ((v1.ventes||[]).length || (v1.entrees||[]).length)){
      D = migrerV1(v1);
      setTimeout(()=>signaler("Données de la version précédente reprises"), 900);
    } else {
      D = normaliser({
        dateDepart: aujourdhui(),
        boissons: CATALOGUE_GEBEN.map((nom,i)=>({
          id:"b"+(i+1), nom, prixAchat:0, prixVente:0, stockInitial:0, seuil:0
        }))
      });
      setTimeout(()=>signaler(CATALOGUE_GEBEN.length+" boissons chargées — fixez les prix pour commencer"), 900);
    }
    enregistrer();
  }
  appliquerTheme();
  chargerJournee(dateVentes);
  majEntete();
  aller("boissons");
}
demarrer();
